<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rainbow Public School - Result Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef3f9;
    color:#222;
}

button,
select,
input{
    font-family:inherit;
}

.loginScreen{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loginBox{
    width:360px;
    max-width:92%;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    text-align:center;
}

.loginBox img{
    width:75px;
    height:75px;
    object-fit:contain;
    margin-bottom:10px;
}

.loginBox h2{
    margin:5px 0;
    color:#1e3a8a;
}

.loginBox p{
    color:#666;
}

.loginBox input{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

.loginBox button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.loginError{
    color:#dc2626;
    margin-top:10px;
    display:none;
}

#app{
    display:none;
}

.topHeader{
    background:linear-gradient(135deg,#1d4ed8,#6d28d9);
    color:white;
    padding:18px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.schoolTitle{
    display:flex;
    align-items:center;
    gap:15px;
}

.schoolTitle img{
    width:60px;
    height:60px;
    object-fit:contain;
    background:white;
    border-radius:10px;
    padding:4px;
}

.schoolTitle h1{
    margin:0;
    font-size:25px;
}

.schoolTitle p{
    margin:4px 0 0;
    font-size:13px;
}

.logoutBtn{
    border:0;
    background:#ef4444;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.nav{
    background:white;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:12px 20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.nav button{
    border:0;
    background:#e5e7eb;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.nav button.active{
    background:#2563eb;
    color:white;
}

.container{
    max-width:1250px;
    margin:20px auto;
    padding:0 15px;
}

.tab{
    display:none;
}

.tab.active{
    display:block;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#1d4ed8;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.field label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin-bottom:5px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:white;
}

.field textarea{
    min-height:70px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

.btn{
    border:0;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin:4px;
}

.btnPrimary{
    background:#2563eb;
    color:white;
}

.btnSuccess{
    background:#16a34a;
    color:white;
}

.btnDanger{
    background:#dc2626;
    color:white;
}

.btnWarning{
    background:#f59e0b;
    color:white;
}

.btnDark{
    background:#334155;
    color:white;
}

.subjectBox{
    border:1px solid #dbeafe;
    background:#f8fbff;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

.subjectRow{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:8px;
    align-items:end;
}

.subjectRow label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:4px;
}

.subjectRow input,
.subjectRow select{
    width:100%;
    padding:9px;
    border:1px solid #cbd5e1;
    border-radius:7px;
}

.examBadge{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    background:#dbeafe;
    color:#1d4ed8;
    font-weight:bold;
    margin-bottom:12px;
}

.message{
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    display:none;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.searchRow{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:10px;
    align-items:end;
}

.tableWrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    border:1px solid #dbe2ea;
    padding:9px;
    text-align:left;
}

th{
    background:#eff6ff;
    color:#1e3a8a;
}

.center{
    text-align:center;
}

.resultPreview{
    margin-top:20px;
}

/* PRINT AREA */

#printArea{
    display:none;
}

.printReport{
    width:100%;
    background:white;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
}

.printHeader{
    border:3px solid #1d4ed8;
    border-radius:10px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:15px;
    background:linear-gradient(135deg,#eff6ff,#f5f3ff);
}

.printLogo{
    width:85px;
    height:85px;
    object-fit:contain;
}

.printSchool{
    flex:1;
    text-align:center;
}

.printSchool h1{
    margin:0;
    color:#1d4ed8;
    font-size:25px;
}

.printSchool h2{
    margin:3px 0;
    font-size:17px;
    color:#7c3aed;
}

.printSchool p{
    margin:2px 0;
    font-size:11px;
}

.studentPhotoBox{
    width:90px;
    height:105px;
    border:2px solid #1d4ed8;
    border-radius:7px;
    overflow:hidden;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
}

.studentPhoto{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photoFallback{
    font-size:10px;
    text-align:center;
    color:#64748b;
}

.reportTitle{
    text-align:center;
    margin:10px 0;
    padding:7px;
    background:#1d4ed8;
    color:white;
    border-radius:6px;
    font-size:17px;
}

.studentInfo{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border:1px solid #94a3b8;
    margin-bottom:10px;
}

.infoCell{
    padding:6px 8px;
    border-right:1px solid #cbd5e1;
    border-bottom:1px solid #cbd5e1;
    font-size:11px;
}

.infoCell b{
    color:#1e3a8a;
}

.printMarks{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
}

.printMarks th{
    background:#2563eb;
    color:white;
    text-align:center;
    font-size:11px;
    padding:6px;
}

.printMarks td{
    text-align:center;
    font-size:11px;
    padding:6px;
}

.printMarks td:first-child,
.printMarks th:first-child{
    text-align:left;
}

.examHead{
    line-height:1.15;
}

.examHead .examName{
    font-size:12px;
    font-weight:bold;
}

.examHead .examMax{
    font-size:10px;
    font-weight:normal;
}

.totalRow td{
    font-weight:bold;
    background:#e0e7ff;
}

.finalRow td{
    font-weight:bold;
    background:#dcfce7;
}

.summaryGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.summaryBox{
    border:1px solid #cbd5e1;
    border-radius:6px;
    padding:7px;
    text-align:center;
    background:#f8fafc;
}

.summaryBox b{
    display:block;
    color:#1e3a8a;
    font-size:10px;
}

.summaryBox span{
    font-size:13px;
    font-weight:bold;
}

.attendanceBox{
    margin-top:10px;
    border:1px solid #94a3b8;
    padding:8px;
    background:#f8fafc;
    font-size:11px;
}

.signatureRow{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    margin-top:35px;
    text-align:center;
    font-size:11px;
}

.signature{
    padding-top:25px;
    border-top:1px solid #333;
}

.printFooter{
    margin-top:10px;
    padding-top:5px;
    border-top:1px solid #cbd5e1;
    font-size:9px;
    text-align:center;
    color:#64748b;
}

/* MOBILE */

@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .searchRow{
        grid-template-columns:1fr 1fr;
    }

    .studentInfo{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .grid{
        grid-template-columns:1fr;
    }

    .subjectRow{
        grid-template-columns:1fr;
    }

    .topHeader{
        flex-direction:column;
        text-align:center;
    }

    .schoolTitle{
        flex-direction:column;
    }

    .searchRow{
        grid-template-columns:1fr;
    }
}

/* PRINT */

@media print{

    @page{
        size:A4;
        margin:7mm;
    }

    body{
        background:white !important;
    }

    body *{
        visibility:hidden !important;
    }

    #printArea,
    #printArea *{
        visibility:visible !important;
    }

    #printArea{
        display:block !important;
        position:absolute;
        left:0;
        top:0;
        width:100%;
        background:white;
    }

    .printReport{
        page-break-inside:avoid;
    }

    .printMarks{
        page-break-inside:auto;
    }

    tr{
        page-break-inside:avoid;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="loginScreen" id="loginScreen">

    <div class="loginBox">

        <img src="logo.png" alt="School Logo">

        <h2>Rainbow Public School</h2>
        <p>Result Management System</p>

        <input
            type="text"
            id="loginUsername"
            placeholder="Username"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="doLogin()">
            LOGIN
        </button>

        <div class="loginError" id="loginError">
            Invalid Username or Password
        </div>

    </div>

</div>


<!-- APP -->

<div id="app">

<header class="topHeader">

    <div class="schoolTitle">

        <img src="logo.png" alt="Logo">

        <div>
            <h1>Rainbow Public School</h1>
            <p>Conducted by Shubhi Education Foundation</p>
            <p>Result Management System</p>
        </div>

    </div>

    <button class="logoutBtn" onclick="logout()">
        Logout
    </button>

</header>


<nav class="nav">

    <button
        class="active"
        onclick="openTab('entryTab',this)">
        Result Entry
    </button>

    <button
        onclick="openTab('studentResultTab',this)">
        Student Result
    </button>

    <button
        onclick="openTab('classResultTab',this)">
        Class Result
    </button>

    <button
        onclick="openTab('schoolResultTab',this)">
        School Result
    </button>

</nav>


<div class="container">

<!-- ================= RESULT ENTRY ================= -->

<section id="entryTab" class="tab active">

<div class="card">

<h2>Result Entry</h2>

<div class="grid">

<div class="field">
<label>Admission No.</label>
<input
    type="text"
    id="admissionNo"
    placeholder="Enter Admission No."
    onblur="loadStudent()"
>
</div>

<div class="field">
<label>Student Name</label>
<input
    type="text"
    id="studentName"
    readonly
>
</div>

<div class="field">
<label>Father Name</label>
<input
    type="text"
    id="fatherName"
    readonly
>
</div>

<div class="field">
<label>Class</label>
<input
    type="text"
    id="className"
    readonly
>
</div>

<div class="field">
<label>Section</label>
<input
    type="text"
    id="section"
    readonly
>
</div>

<div class="field">
<label>Session</label>
<select id="session">
    <option value="2026-27">2026-27</option>
    <option value="2027-28">2027-28</option>
    <option value="2028-29">2028-29</option>
    <option value="2029-30">2029-30</option>
    <option value="2030-31">2030-31</option>
</select>
</div>

<div class="field">
<label>Exam</label>

<select id="examType" onchange="loadExamSubjects()">

    <option value="FA-1">FA-1</option>
    <option value="SA-1">SA-1</option>
    <option value="FA-2">FA-2</option>
    <option value="SA-2">SA-2</option>

</select>

</div>

</div>

<div id="studentMsg" class="message"></div>

</div>


<div class="card">

<div>
    <span class="examBadge" id="examBadge">
        FA-1
    </span>
</div>

<h2>Subjects & Marks</h2>

<div id="subjectsContainer"></div>

<button
    class="btn btnPrimary"
    type="button"
    onclick="addSubject()">
    + Add Subject
</button>

<button
    class="btn btnDark"
    type="button"
    onclick="loadDefaultSubjects()">
    Load Common Subjects
</button>

</div>


<div class="card">

<h2>Attendance</h2>

<div class="grid">

<div class="field">
<label>Working Days</label>
<input
    type="number"
    id="workingDays"
    min="0"
    value="0"
    oninput="calculateAttendance()"
>
</div>

<div class="field">
<label>Present Days</label>
<input
    type="number"
    id="presentDays"
    min="0"
    value="0"
    oninput="calculateAttendance()"
>
</div>

<div class="field">
<label>Absent Days</label>
<input
    type="number"
    id="absentDays"
    min="0"
    value="0"
>
</div>

<div class="field">
<label>Attendance %</label>
<input
    type="number"
    id="attendancePercentage"
    readonly
>
</div>

</div>

</div>


<div class="card">

<h2>Remarks</h2>

<div class="field">
<textarea
    id="remarks"
    placeholder="Remarks"
></textarea>
</div>

<button
    class="btn btnSuccess"
    type="button"
    onclick="saveResult()">
    SAVE RESULT
</button>

<button
    class="btn btnWarning"
    type="button"
    onclick="clearEntry()">
    CLEAR
</button>

<div id="saveMsg" class="message"></div>

</div>

</section>


<!-- ================= STUDENT RESULT ================= -->

<section id="studentResultTab" class="tab">

<div class="card">

<h2>Student Result</h2>

<div class="searchRow">

<div class="field">

<label>Admission No.</label>

<input
    type="text"
    id="resultAdmissionNo"
    placeholder="Admission No."
>

</div>


<div class="field">

<label>Session</label>

<select id="resultSession">

<option value="2026-27">2026-27</option>
<option value="2027-28">2027-28</option>
<option value="2028-29">2028-29</option>
<option value="2029-30">2029-30</option>
<option value="2030-31">2030-31</option>

</select>

</div>


<div class="field">

<label>Result</label>

<select id="resultExam">

<option value="FA-1">FA-1 Only</option>
<option value="SA-1">SA-1 Only</option>
<option value="FA-2">FA-2 Only</option>
<option value="SA-2">SA-2 Only</option>

<option value="FA1-SA1">
FA-1 + SA-1
</option>

<option value="FA2-SA2">
FA-2 + SA-2
</option>

<option value="FINAL">
FINAL RESULT
</option>

</select>

</div>


<div>

<button
    class="btn btnPrimary"
    onclick="showStudentResult()">
    VIEW RESULT
</button>

</div>

</div>

</div>


<div
    id="studentResultPreview"
    class="resultPreview">
</div>

</section>


<!-- ================= CLASS RESULT ================= -->

<section id="classResultTab" class="tab">

<div class="card">

<h2>Class Result</h2>

<div class="grid">

<div class="field">

<label>Session</label>

<select id="classSession">

<option value="2026-27">2026-27</option>
<option value="2027-28">2027-28</option>
<option value="2028-29">2028-29</option>
<option value="2029-30">2029-30</option>
<option value="2030-31">2030-31</option>

</select>

</div>


<div class="field">

<label>Class</label>

<select id="classFilter">

<option value="">Select Class</option>
<option>Nursery</option>
<option>UKG</option>
<option>SRKG</option>
<option>1st</option>
<option>2nd</option>
<option>3rd</option>
<option>4th</option>
<option>5th</option>
<option>6th</option>
<option>7th</option>
<option>8th</option>
<option>9th</option>
<option>10th</option>

</select>

</div>


<div class="field">

<label>Exam</label>

<select id="classExam">

<option value="FA-1">FA-1</option>
<option value="SA-1">SA-1</option>
<option value="FA-2">FA-2</option>
<option value="SA-2">SA-2</option>

</select>

</div>

<div>

<button
    class="btn btnPrimary"
    onclick="showClassResult()">
    VIEW
</button>

</div>

</div>

</div>

<div id="classResultPreview"></div>

</section>


<!-- ================= SCHOOL RESULT ================= -->

<section id="schoolResultTab" class="tab">

<div class="card">

<h2>School Result</h2>

<div class="grid">

<div class="field">

<label>Session</label>

<select id="schoolSession">

<option value="2026-27">2026-27</option>
<option value="2027-28">2027-28</option>
<option value="2028-29">2028-29</option>
<option value="2029-30">2029-30</option>
<option value="2030-31">2030-31</option>

</select>

</div>


<div class="field">

<label>Exam</label>

<select id="schoolExam">

<option value="FA-1">FA-1</option>
<option value="SA-1">SA-1</option>
<option value="FA-2">FA-2</option>
<option value="SA-2">SA-2</option>

</select>

</div>

<div>

<button
    class="btn btnPrimary"
    onclick="showSchoolResult()">
    VIEW SCHOOL RESULT
</button>

</div>

</div>

</div>

<div id="schoolResultPreview"></div>

</section>

</div>

</div>


<!-- PRINT AREA -->

<div id="printArea"></div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://kqahcvaoxnmxfcgyyync.supabase.co";

const SUPABASE_KEY =
"sb_publishable_S1BSJ6qcJ5Emg-5YhXPmVA_Rj_wvZvl";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   LOGIN
========================================== */

function doLogin(){

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if(
        username === "admin" &&
        password === "admin123"
    ){

        localStorage.setItem("result_login","yes");

        document.getElementById("loginScreen").style.display="none";
        document.getElementById("app").style.display="block";

        loadDefaultSubjects();

    }else{

        document.getElementById("loginError").style.display="block";

    }

}


function logout(){

    localStorage.removeItem("result_login");

    location.reload();

}


if(
    localStorage.getItem("result_login")==="yes"
){

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";

}


/* ==========================================
   TABS
========================================== */

function openTab(id,button){

    document.querySelectorAll(".tab")
        .forEach(x=>x.classList.remove("active"));

    document.querySelectorAll(".nav button")
        .forEach(x=>x.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");

    if(button){
        button.classList.add("active");
    }

}


/* ==========================================
   SUBJECT DEFAULTS
========================================== */

function commonSubjects(){

    const cls =
        document.getElementById("className").value
        .toLowerCase();

    if(
        cls==="nursery" ||
        cls==="ukg" ||
        cls==="srkg"
    ){

        return [
            "English",
            "Hindi",
            "Mathematics",
            "Gujarati",
            "EVS"
        ];

    }

    return [
        "English",
        "Hindi",
        "Gujarati",
        "Mathematics",
        "EVS",
        "Science",
        "Social Science",
        "Computer"
    ];

}


function loadDefaultSubjects(){

    const container =
        document.getElementById("subjectsContainer");

    if(!container) return;

    container.innerHTML="";

    commonSubjects().forEach(
        subject=>addSubject(subject)
    );

}


function addSubject(subject=""){

    const container =
        document.getElementById("subjectsContainer");

    const exam =
        document.getElementById("examType").value;

    const max =
        exam==="FA-1" || exam==="FA-2"
        ?30
        :50;

    const box =
        document.createElement("div");

    box.className="subjectBox";

    box.innerHTML=`

/* ==========================================
   ATTENDANCE
========================================== */

function calculateAttendance(){

    const working =
        Number(
            document.getElementById("workingDays").value
        );

    const present =
        Number(
            document.getElementById("presentDays").value
        );

    const absent =
        Math.max(
            0,
            working-present
        );

    document.getElementById("absentDays")
        .value=absent;

    const percentage =
        working>0
        ?((present/working)*100).toFixed(2)
        :0;

    document.getElementById("attendancePercentage")
        .value=percentage;

}


/* ==========================================
   SAVE RESULT
========================================== */

async function saveResult(){

    const admissionNo =
        document.getElementById("admissionNo")
        .value.trim();

    if(!admissionNo){

        alert("Please enter Admission No.");

        return;

    }

    const examType =
        document.getElementById("examType").value;

    const session =
        document.getElementById("session").value;

    const rows =
        [...document.querySelectorAll(".subjectBox")];

    if(!rows.length){

        alert("Please add subjects.");

        return;

    }

    const marks=[];

    let totalMax=0;
    let obtained=0;

    for(const row of rows){

        const subject =
            row.querySelector(".subjectName").value.trim();

        const max =
            Number(
                row.querySelector(".maxMarks").value
            );

        const got =
            Number(
                row.querySelector(".obtainedMarks").value
            );

        if(!subject){

            alert("Please select subject.");

            return;

        }

        if(got>max){

            alert(
                subject+
                ": Obtained marks cannot be greater than maximum marks."
            );

            return;

        }

        marks.push({
            subject:subject,
            max:max,
            obtained:got
        });

        totalMax+=max;
        obtained+=got;

    }

    const percentage =
        totalMax>0
        ?Number(
            ((obtained/totalMax)*100)
            .toFixed(2)
        )
        :0;

    const grade =
        calculateGrade(percentage);

    const result =
        percentage>=33
        ?"PASS"
        :"FAIL";

    const workingDays =
        Number(
            document.getElementById("workingDays").value
        )||0;

    const presentDays =
        Number(
            document.getElementById("presentDays").value
        )||0;

    const absentDays =
        Number(
            document.getElementById("absentDays").value
        )||0;

    const attendancePercentage =
        workingDays>0
        ?Number(
            ((presentDays/workingDays)*100)
            .toFixed(2)
        )
        :0;

    const {data:studentData} =
        await supabaseClient
        .from("students")
        .select("*")
        .eq("admission_no",admissionNo)
        .limit(1);

    const student =
        studentData && studentData.length
        ?studentData[0]
        :null;

    const payload={

        student_id:
            student
            ?String(student.id)
            :null,

        admission_no:admissionNo,

        student_name:
            document.getElementById("studentName").value,

        father_name:
            document.getElementById("fatherName").value,

        class_name:
            document.getElementById("className").value,

        section:
            document.getElementById("section").value,

        session:session,

        exam_type:examType,

        marks:marks,

        total_max:totalMax,

        obtained_marks:obtained,

        percentage:percentage,

        grade:grade,

        result:result,

        working_days:workingDays,

        present_days:presentDays,

        absent_days:absentDays,

        attendance_percentage:
            attendancePercentage,

        remarks:
            document.getElementById("remarks").value

    };


    const {data:existing} =
        await supabaseClient
        .from("student_results")
        .select("id")
        .eq("admission_no",admissionNo)
        .eq("session",session)
        .eq("exam_type",examType)
        .limit(1);


    let error=null;

    if(existing && existing.length){

        const response =
            await supabaseClient
            .from("student_results")
            .update(payload)
            .eq("id",existing[0].id);

        error=response.error;

    }else{

        const response =
            await supabaseClient
            .from("student_results")
            .insert(payload);

        error=response.error;

    }


    const msg =
        document.getElementById("saveMsg");

    if(error){

        showMessage(
            msg,
            error.message,
            false
        );

        return;

    }

    showMessage(
        msg,
        "Result saved successfully.",
        true
    );

}


/* ==========================================
   GRADE
========================================== */

function calculateGrade(p){

    if(p>=90) return "A+";
    if(p>=80) return "A";
    if(p>=70) return "B+";
    if(p>=60) return "B";
    if(p>=50) return "C+";
    if(p>=40) return "C";
    if(p>=33) return "D";

    return "F";

}

   STUDENT INFO + PHOTO
========================================== */

async function getStudentInfo(admissionNo){

    const { data, error } = await supabaseClient
        .from("students")
        .select("*")
        .eq("admission_no", admissionNo.trim())
        .limit(1);

    if(error){
        console.error("Student info error:", error.message);
        return null;
    }

    if(!data || !data.length) return null;

    const student = data[0];

    // Different versions of Student Master/admission form may use different photo field names.
    const photoValue = String(
        student.photo || student.photo_url || student.student_photo ||
        student.photoUrl || student.image_url || student.image || ""
    ).trim();

    let photoUrl = "";
    if(photoValue){
        if(/^https?:\/\//i.test(photoValue) || /^data:image\//i.test(photoValue)){
            photoUrl = photoValue;
        } else if(/^\/?storage\/v1\/object\/public\//i.test(photoValue)){
            photoUrl = SUPABASE_URL + "/" + photoValue.replace(/^\/+/, "");
        } else {
            let bucket = "admission-photos";
            let filePath = photoValue.replace(/^\/+/, "");
            if(/^student-photos\//i.test(filePath)){
                bucket = "student-photos";
                filePath = filePath.replace(/^student-photos\//i, "");
            } else if(/^admission-photos\//i.test(filePath)){
                filePath = filePath.replace(/^admission-photos\//i, "");
            }
            const { data: urlData } = supabaseClient.storage.from(bucket).getPublicUrl(filePath);
            photoUrl = urlData?.publicUrl || "";
        }
    }

    console.log("Student admission number:", student.admission_no);
    console.log("Student photo value:", photoValue);
    console.log("Resolved photo URL:", photoUrl);

    return { ...student, photoUrl };
}

/* ==========================================
   FINAL COMBINED RESULT
========================================== */

function createCombinedReport(
    student,
    results
){

    const fa1 =
        results.find(
            r=>r.exam_type==="FA-1"
        );

    const sa1 =
        results.find(
            r=>r.exam_type==="SA-1"
        );

    const fa2 =
        results.find(
            r=>r.exam_type==="FA-2"
        );

    const sa2 =
        results.find(
            r=>r.exam_type==="SA-2"
        );


    /*
       IMPORTANT:
       Exam totals are taken directly
       from saved result records.
    */

    const fa1Obt =
        Number(fa1?.obtained_marks||0);

    const fa1Max =
        Number(fa1?.total_max||0);

    const sa1Obt =
        Number(sa1?.obtained_marks||0);

    const sa1Max =
        Number(sa1?.total_max||0);

    const fa2Obt =
        Number(fa2?.obtained_marks||0);

    const fa2Max =
        Number(fa2?.total_max||0);

    const sa2Obt =
        Number(sa2?.obtained_marks||0);

    const sa2Max =
        Number(sa2?.total_max||0);


    const finalObt =
        fa1Obt+
        sa1Obt+
        fa2Obt+
        sa2Obt;


    const finalMax =
        fa1Max+
        sa1Max+
        fa2Max+
        sa2Max;


    const finalPercentage =
        finalMax>0
        ?((finalObt/finalMax)*100)
            .toFixed(2)
        :0;


    const finalGrade =
        calculateGrade(
            Number(finalPercentage)
        );


    const finalResult =
        Number(finalPercentage)>=33
        ?"PASS"
        :"FAIL";


    /*
       Collect all subjects
    */

    const subjectMap={};


    results.forEach(r=>{

        const marks =
            Array.isArray(r.marks)
            ?r.marks
            :[];


        marks.forEach(m=>{

            const subject =
                m.subject || "Subject";


            if(!subjectMap[subject]){

                subjectMap[subject]={
                    "FA-1":"",
                    "SA-1":"",
                    "FA-2":"",
                    "SA-2":"",
                    final:0
                };

            subjectMap[subject][
                r.exam_type
            ] =
                Number(m.obtained||0);


            subjectMap[subject].final +=
                Number(m.obtained||0);

        });

    const subjects =
        Object.keys(subjectMap);


    let rows="";


    subjects.forEach(subject=>{

            <td>${s["FA-2"]}</td>

            <td>${s["SA-2"]}</td>

            <td>
                <b>${s.final}</b>
            </td>

        </tr>

        `;

    });


    /*
       EXACT FORMAT REQUESTED:
       FA-1
       30

       SA-1
       50

       FA-2
       30

       SA-2
       50

       No "Max" word.
    */


    return `

    ${reportHeader(
        student,
        "FINAL RESULT"
    )}


    <table class="printMarks">

        <thead>

            <tr>

                <th>Subject</th>

                <th>

                    <div class="examHead">

                        <div class="examName">
                            FA-1
                        </div>

                        <div class="examMax">
                            30
                        </div>

                    </div>

                </th>


                <th>

                    <div class="examHead">

                        <div class="examName">
                            SA-1
                        </div>

                        <div class="examMax">
                            50
                        </div>

                    </div>

                </th>


                <th>

                    <div class="examHead">

                        <div class="examName">
                            FA-2
                        </div>

                        <div class="examMax">
                            30
                        </div>

                    </div>

                </th>


                <th>

                    <div class="examHead">

                        <div class="examName">
                            SA-2
                        </div>

                        <div class="examMax">
                            50
                        </div>

                    </div>

                </th>


                <th>
                    Final Total
                </th>

            </tr>

        </thead>


        <tbody>

            ${rows}


            <tr class="totalRow">

                <td>
                    TOTAL
                </td>

                <td>
                    ${fa1Obt}
                </td>

                <td>
                    ${sa1Obt}
                </td>

                <td>
                    ${fa2Obt}
                </td>

                <td>
                    ${sa2Obt}
                </td>

                <td>
                    ${finalObt}
                </td>

            </tr>

        </tbody>

    </table>


    <div class="summaryGrid">

        <div class="summaryBox">
            <b>FA-1</b>
            <span>
                ${fa1Obt}/${fa1Max}
            </span>
        </div>

        <div class="summaryBox">
            <b>SA-1</b>
            <span>
                ${sa1Obt}/${sa1Max}
            </span>
        </div>

        <div class="summaryBox">

        </div>

async function showStudentResult(){

    const admissionNo =
        document.getElementById(
            "resultAdmissionNo"
        ).value.trim();

    const session =
        document.getElementById(
            "resultSession"
        ).value;

    const exam =
        document.getElementById(
            "resultExam"
        ).value;


    if(!admissionNo){

        alert("Please enter Admission No.");

        return;

    }


    const preview =
        document.getElementById(
            "studentResultPreview"
        );


    preview.innerHTML =
        "<div class='card'>Loading result...</div>";


    const student =
        await getStudentInfo(admissionNo);


    if(!student){

        preview.innerHTML =
            "<div class='card'>Student not found.</div>";

        return;

    }


    const {data,error} =
        await supabaseClient
        .from("student_results")
        .select("*")
        .eq("admission_no",admissionNo)
        .eq("session",session)
        .order("exam_type");


    if(error){

        preview.innerHTML =
            `<div class="card">${escapeHtml(error.message)}</div>`;

        return;

    }


    if(!data || !data.length){

        preview.innerHTML =
            "<div class='card'>No result found.</div>";

        return;

    }


    let resultHTML="";


    if(
        exam==="FINAL"
    ){

        resultHTML =
            createCombinedReport(
                student,
                data
            );

    }else if(
        exam==="FA1-SA1"
    ){

        const selected =
            data.filter(
                r=>
                    r.exam_type==="FA-1" ||
                    r.exam_type==="SA-1"
            );

        resultHTML =
            createCombinedReport(
                student,
                selected
            );

    }else if(
        exam==="FA2-SA2"
    ){

        const selected =
            data.filter(
                r=>
                    r.exam_type==="FA-2" ||
                    r.exam_type==="SA-2"
            );

        resultHTML =
            createCombinedReport(
                student,
                selected
            );

    }else{

        const one =
            data.find(
                r=>r.exam_type===exam
            );


        if(!one){

            preview.innerHTML =
                `<div class="card">
                    ${escapeHtml(exam)}
                    result not found.
                </div>`;

            return;

        }


        resultHTML =
            createSingleReport(
                student,
                one
            );

    }


    window.currentResultHTML =
        resultHTML;


    preview.innerHTML = `

        <div class="card center">

            <button
                class="btn btnSuccess"
                onclick="printCurrentResult()">

                🖨️ PRINT RESULT

            </button>

        </div>

        ${resultHTML}

    `;

}


/* ==========================================
   PRINT
========================================== */

function printCurrentResult(){

    if(!window.currentResultHTML){

        alert(
            "Please open/view the result first."
        );

        return;

    }


    const printArea =
        document.getElementById(
            "printArea"
        );


    printArea.innerHTML =
        window.currentResultHTML;


    printArea.style.display="block";

    // Print se pehle student photo aur logo load hone ka intezar karein.
    const images = Array.from(printArea.querySelectorAll("img"));
    const waitForImage = img => {
        if(img.complete) return Promise.resolve();
        return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
            setTimeout(resolve, 2500);
        });
    };

    Promise.all(images.map(waitForImage)).then(() => {
        window.print();
    });

}

/* ==========================================
   DATE
========================================== */

function formatDate(date){

    const d =
        String(date.getDate())
        .padStart(2,"0");

    const m =
        String(date.getMonth()+1)
        .padStart(2,"0");

    const y =
        date.getFullYear();

    return `${d}/${m}/${y}`;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
