<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rainbow Public School - Result Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef5ff,#fff8ec);
    color:#1f2937;
}

/* ================= LOGIN ================= */

#loginScreen{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#123b7a,#2575fc);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.login-box{
    width:380px;
    max-width:92%;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    text-align:center;
}

.login-box img{
    width:90px;
    height:90px;
    object-fit:contain;
    margin-bottom:10px;
}

.login-box h2{
    margin:5px 0;
    color:#123b7a;
}

.login-box p{
    color:#666;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

.login-box button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#1261d6;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

#loginError{
    color:#dc2626;
    font-weight:bold;
    margin-top:10px;
}

/* ================= HEADER ================= */

.top-header{
    background:linear-gradient(135deg,#123b7a,#1769aa,#2575fc);
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.school-title{
    display:flex;
    align-items:center;
    gap:15px;
}

.school-title img{
    width:65px;
    height:65px;
    object-fit:contain;
    background:white;
    border-radius:12px;
    padding:4px;
}

.school-title h1{
    margin:0;
    font-size:25px;
}

.school-title p{
    margin:4px 0 0;
    font-size:13px;
    opacity:.95;
}

.header-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.header-buttons button{
    border:0;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.home-btn{
    background:#fff;
    color:#123b7a;
}

.logout-btn{
    background:#ef4444;
    color:white;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

/* ================= TABS ================= */

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tab-btn{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    background:#e5e7eb;
    color:#374151;
    cursor:pointer;
    font-weight:bold;
}

.tab-btn.active{
    background:#1261d6;
    color:white;
}

/* ================= CARDS ================= */

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 7px 25px rgba(0,0,0,.08);
    border:1px solid #e5e7eb;
}

.card h2{
    margin-top:0;
    color:#123b7a;
}

.card h3{
    color:#1769aa;
}

/* ================= FORMS ================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
    color:#374151;
}

.form-group input,
.form-group select,
.form-group textarea{
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#2575fc;
    box-shadow:0 0 0 3px rgba(37,117,252,.1);
}

.full{
    grid-column:1/-1;
}

textarea{
    min-height:80px;
    resize:vertical;
}

/* ================= BUTTONS ================= */

.btn{
    border:0;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin:3px;
}

.btn-primary{
    background:#1261d6;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-warning{
    background:#f59e0b;
    color:white;
}

.btn-info{
    background:#0891b2;
    color:white;
}

.btn-dark{
    background:#1f2937;
    color:white;
}

.btn-light{
    background:#e5e7eb;
    color:#111827;
}

/* ================= SUBJECTS ================= */

.subject-box{
    margin-top:20px;
    border:1px solid #dbeafe;
    background:#f8fbff;
    border-radius:14px;
    padding:15px;
}

.subject-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:8px;
    margin-bottom:8px;
    align-items:center;
}

.subject-row input,
.subject-row select{
    padding:10px;
    border:1px solid #d1d5db;
    border-radius:7px;
}

.remove-subject{
    background:#dc2626;
    color:white;
    border:0;
    padding:9px 12px;
    border-radius:7px;
    cursor:pointer;
}

/* ================= TABLE ================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#123b7a;
    color:white;
    padding:10px;
    font-size:13px;
}

td{
    padding:9px;
    border:1px solid #ddd;
    text-align:center;
    font-size:13px;
}

tr:nth-child(even){
    background:#f8fafc;
}

td input{
    width:80px;
    padding:7px;
    border:1px solid #ccc;
    border-radius:6px;
    text-align:center;
}

/* ================= SEARCH ================= */

.search-box{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:10px;
}

.search-box input,
.search-box select{
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
}

/* ================= MESSAGE ================= */

.message{
    padding:12px;
    border-radius:8px;
    margin:10px 0;
    display:none;
    font-weight:bold;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

/* ================= REPORT PREVIEW ================= */

#studentResultPreview{
    margin-top:20px;
}

.report-actions{
    background:#eef6ff;
    border:1px solid #bfdbfe;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
    text-align:right;
}

.print-result-btn{
    background:linear-gradient(135deg,#0f4c81,#2575fc);
    color:white;
    border:0;
    padding:13px 22px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.report-page{
    background:white;
    max-width:900px;
    margin:20px auto;
    padding:25px;
    border:8px solid #e8f1ff;
    border-radius:8px;
    box-shadow:0 4px 25px rgba(0,0,0,.12);
    position:relative;
    overflow:hidden;
}

.report-page:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    right:0;
    height:8px;
    background:linear-gradient(90deg,#ff7a18,#2575fc,#16a34a);
}

.report-header{
    display:flex;
    align-items:center;
    gap:18px;
    border-bottom:3px solid #1769aa;
    padding-bottom:12px;
    margin-bottom:15px;
}

.report-school-logo{
    width:85px;
    height:85px;
    object-fit:contain;
    border:2px solid #dbeafe;
    border-radius:12px;
    padding:3px;
    background:white;
}

.report-school{
    flex:1;
    text-align:center;
}

.report-school h1{
    margin:0;
    color:#123b7a;
    font-size:25px;
}

.report-school h2{
    margin:4px 0;
    color:#1769aa;
    font-size:17px;
}

.report-school p{
    margin:2px 0;
    font-size:11px;
}

.report-title{
    text-align:center;
    background:linear-gradient(90deg,#eff6ff,#fff7ed);
    border:1px solid #bfdbfe;
    padding:8px;
    border-radius:8px;
    margin:12px 0;
    color:#123b7a;
    font-size:18px;
    font-weight:bold;
}

.student-info{
    display:grid;
    grid-template-columns:1fr 1fr 125px;
    gap:0;
    border:1px solid #9ca3af;
    margin-bottom:15px;
}

.info-cell{
    padding:7px 9px;
    border-right:1px solid #d1d5db;
    border-bottom:1px solid #d1d5db;
    font-size:11px;
}

.info-cell strong{
    color:#123b7a;
}

.student-photo{
    grid-column:3;
    grid-row:1 / span 4;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:0;
    padding:8px;
}

.student-photo img{
    width:90px;
    height:110px;
    object-fit:cover;
    border:2px solid #123b7a;
    border-radius:5px;
}

.no-photo{
    width:90px;
    height:110px;
    border:2px dashed #aaa;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    color:#777;
    text-align:center;
}

.marks-table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

.marks-table th{
    background:linear-gradient(135deg,#123b7a,#1769aa);
    color:white;
    padding:7px 4px;
    border:1px solid white;
    font-size:10px;
}

.marks-table td{
    border:1px solid #aaa;
    padding:6px 4px;
    font-size:10px;
}

.marks-table tbody tr:nth-child(even){
    background:#f3f8ff;
}

.marks-table tfoot td{
    background:#eaf2ff;
    font-weight:bold;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:12px;
}

.summary-box{
    border:1px solid #bfdbfe;
    background:#f8fbff;
    border-radius:7px;
    padding:7px;
    text-align:center;
    font-size:10px;
}

.summary-box strong{
    display:block;
    color:#123b7a;
    font-size:13px;
}

.attendance-box{
    margin-top:12px;
    border:1px solid #a7f3d0;
    background:#ecfdf5;
    padding:9px;
    border-radius:7px;
    font-size:11px;
}

.remarks-box{
    margin-top:10px;
    border:1px solid #fde68a;
    background:#fffbeb;
    padding:9px;
    min-height:45px;
    font-size:11px;
}

.signature-area{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
    margin-top:55px;
    text-align:center;
}

.signature{
    border-top:1px solid #444;
    padding-top:6px;
    font-size:11px;
}

.footer-note{
    text-align:center;
    font-size:9px;
    color:#666;
    margin-top:20px;
}

/* ================= PRINT AREA ================= */

#printArea{
    display:none;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .search-box{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .search-box{
        grid-template-columns:1fr;
    }

    .subject-row{
        grid-template-columns:1fr;
    }

    .top-header{
        padding:15px;
    }

    .school-title h1{
        font-size:20px;
    }

    .student-info{
        grid-template-columns:1fr 1fr;
    }

    .student-photo{
        grid-column:1/-1;
        grid-row:auto;
    }

    .summary-grid{
        grid-template-columns:1fr 1fr;
    }
}

/* ================= PRINT ================= */

@page{
    size:A4;
    margin:7mm;
}

@media print{

    html,
    body{
        width:210mm;
        min-height:297mm;
        background:white!important;
        margin:0!important;
        padding:0!important;
    }

    body *{
        visibility:hidden!important;
    }

    #printArea,
    #printArea *{
        visibility:visible!important;
    }

    #printArea{
        display:block!important;
        position:absolute!important;
        left:0!important;
        top:0!important;
        width:100%!important;
        background:white!important;
    }

    .report-page{
        width:100%!important;
        max-width:none!important;
        margin:0!important;
        box-shadow:none!important;
        border:4px solid #e8f1ff!important;
        page-break-after:always;
        -webkit-print-color-adjust:exact!important;
        print-color-adjust:exact!important;
    }

    .report-page:last-child{
        page-break-after:auto;
    }

    .report-header,
    .student-info,
    .marks-table,
    .summary-grid,
    .attendance-box,
    .remarks-box,
    .signature-area{
        page-break-inside:avoid;
    }
}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginScreen">

    <div class="login-box">

        <img src="logo.png" alt="School Logo">

        <h2>Rainbow Public School</h2>

        <p>Result Management System</p>

        <input
            type="text"
            id="loginUsername"
            placeholder="Username"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="doLogin()">
            LOGIN
        </button>

        <div id="loginError"></div>

    </div>

</div>


<!-- ================= MAIN ================= -->

<div id="mainApp" style="display:none;">

<header class="top-header">

    <div class="school-title">

        <img src="logo.png" alt="School Logo">

        <div>

            <h1>Rainbow Public School</h1>

            <p>
                Conducted by Shubhi Education Foundation, Dahod
            </p>

        </div>

    </div>

    <div class="header-buttons">

        <button
            class="home-btn"
            onclick="goHome()">
            🏠 Home
        </button>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="container">

    <!-- ================= TABS ================= -->

    <div class="tabs">

        <button
            class="tab-btn active"
            onclick="showTab('entryTab',this)">
            ✏️ Result Entry
        </button>

        <button
            class="tab-btn"
            onclick="showTab('studentTab',this)">
            👨‍🎓 Student Result
        </button>

        <button
            class="tab-btn"
            onclick="showTab('classTab',this)">
            🏫 Class Result
        </button>

        <button
            class="tab-btn"
            onclick="showTab('schoolTab',this)">
            📊 School Result
        </button>

    </div>


    <!-- ================= RESULT ENTRY ================= -->

    <section id="entryTab" class="tab-content">

        <div class="card">

            <h2>📝 Result Entry</h2>

            <div id="entryMessage" class="message"></div>

            <div class="form-grid">

                <div class="form-group">

                    <label>Admission No.</label>

                    <input
                        type="text"
                        id="admissionNo"
                        placeholder="Enter Admission No."
                        onblur="loadStudent()">

                </div>


                <div class="form-group">

                    <label>Student Name</label>

                    <input
                        type="text"
                        id="studentName"
                        readonly>

                </div>


                <div class="form-group">

                    <label>Father Name</label>

                    <input
                        type="text"
                        id="fatherName"
                        readonly>

                </div>


                <div class="form-group">

                    <label>Class</label>

                    <input
                        type="text"
                        id="className"
                        readonly>

                </div>


                <div class="form-group">

                    <label>Section</label>

                    <input
                        type="text"
                        id="section"
                        readonly>

                </div>


                <div class="form-group">

                    <label>Session</label>

                    <select id="session">

                        <option value="2026-27">2026-27</option>
                        <option value="2027-28">2027-28</option>
                        <option value="2028-29">2028-29</option>
                        <option value="2029-30">2029-30</option>
                        <option value="2030-31">2030-31</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Exam</label>

                    <select
                        id="examType"
                        onchange="changeExamType()">

                        <option value="FA-1">FA-1</option>
                        <option value="SA-1">SA-1</option>
                        <option value="FA-2">FA-2</option>
                        <option value="SA-2">SA-2</option>

                    </select>

                </div>

            </div>


            <!-- SUBJECTS -->

            <div class="subject-box">

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    flex-wrap:wrap;
                    gap:10px;
                ">

                    <h3 style="margin:0;">
                        📚 Subjects & Marks
                    </h3>

                    <button
                        class="btn btn-success"
                        onclick="addSubject()">
                        ➕ Add Subject
                    </button>

                </div>

                <p style="
                    font-size:12px;
                    color:#666;
                ">
                    FA exams = 30 marks &nbsp; | &nbsp;
                    SA exams = 50 marks
                </p>

                <div id="subjectRows"></div>

            </div>


            <!-- ATTENDANCE -->

            <div class="subject-box">

                <h3>📅 Attendance</h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Working Days</label>

                        <input
                            type="number"
                            id="workingDays"
                            min="0"
                            value="0"
                            oninput="calculateAttendance()">

                    </div>

                    <div class="form-group">

                        <label>Present Days</label>

                        <input
                            type="number"
                            id="presentDays"
                            min="0"
                            value="0"
                            oninput="calculateAttendance()">

                    </div>

                    <div class="form-group">

                        <label>Absent Days</label>

                        <input
                            type="number"
                            id="absentDays"
                            min="0"
                            value="0"
                            readonly>

                    </div>

                    <div class="form-group">

                        <label>Attendance %</label>

                        <input
                            type="number"
                            id="attendancePercentage"
                            readonly>

                    </div>

                </div>

            </div>


            <!-- REMARKS -->

            <div class="form-group" style="margin-top:15px;">

                <label>Remarks</label>

                <textarea
                    id="remarks"
                    placeholder="Enter teacher remarks"></textarea>

            </div>


            <!-- ACTIONS -->

            <div style="
                margin-top:20px;
                text-align:center;
            ">

                <button
                    class="btn btn-primary"
                    onclick="saveResult()">
                    💾 Save Result
                </button>

                <button
                    class="btn btn-warning"
                    onclick="loadExistingResult()">
                    🔄 Load Existing
                </button>

                <button
                    class="btn btn-light"
                    onclick="clearEntry()">
                    🧹 Clear
                </button>

            </div>

        </div>

    </section>


    <!-- ================= STUDENT RESULT ================= -->

    <section
        id="studentTab"
        class="tab-content"
        style="display:none;">

        <div class="card">

            <h2>👨‍🎓 Student Result</h2>

            <div class="search-box">

                <input
                    id="resultAdmissionNo"
                    placeholder="Admission No.">

                <select id="resultSession">

                    <option value="2026-27">2026-27</option>
                    <option value="2027-28">2027-28</option>
                    <option value="2028-29">2028-29</option>
                    <option value="2029-30">2029-30</option>
                    <option value="2030-31">2030-31</option>

                </select>

                <select id="resultExam">

                    <option value="FA-1">FA-1 Only</option>
                    <option value="SA-1">SA-1 Only</option>
                    <option value="FA-2">FA-2 Only</option>
                    <option value="SA-2">SA-2 Only</option>
                    <option value="FA1-SA1">FA-1 + SA-1</option>
                    <option value="FA2-SA2">FA-2 + SA-2</option>
                    <option value="FINAL">Final Result - All</option>

                </select>

                <button
                    class="btn btn-primary"
                    onclick="showStudentResult()">
                    🔎 View Result
                </button>

            </div>

            <div id="studentResultPreview"></div>

        </div>

    </section>


    <!-- ================= CLASS RESULT ================= -->

    <section
        id="classTab"
        class="tab-content"
        style="display:none;">

        <div class="card">

            <h2>🏫 Class Result</h2>

            <div class="search-box">

                <select id="classResultSession">

                    <option value="2026-27">2026-27</option>
                    <option value="2027-28">2027-28</option>
                    <option value="2028-29">2028-29</option>
                    <option value="2029-30">2029-30</option>
                    <option value="2030-31">2030-31</option>

                </select>

                <select id="classResultClass">

                    <option value="">Select Class</option>
                    <option>Nursery</option>
                    <option>UKG</option>
                    <option>SRKG</option>
                    <option>1st</option>
                    <option>2nd</option>
                    <option>3rd</option>
                    <option>4th</option>
                    <option>5th</option>
                    <option>6th</option>
                    <option>7th</option>
                    <option>8th</option>
                    <option>9th</option>

function calculateAttendance(){

        Number(
            document.getElementById("workingDays").value
        ) || 0;

    const present =
        Number(
            document.getElementById("presentDays").value
        ) || 0;

    let absent =
        working-present;

    if(absent<0) absent=0;

    let percentage=0;

    if(working>0){

            (present/working)*100;

    document.getElementById("absentDays").value =

        percentage.toFixed(2);

/* =========================================================
   SAVE RESULT
========================================================= */

async function saveResult(){

    const admissionNo =
        document.getElementById("admissionNo")
        .value.trim();

    const studentName =
        document.getElementById("studentName").value.trim();

    const fatherName =
        document.getElementById("fatherName").value.trim();

    const className =
        document.getElementById("className").value.trim();

    const section =
        document.getElementById("section").value.trim();

    const session =
        document.getElementById("session").value;

    const examType =
        document.getElementById("examType").value;

    if(!admissionNo){

        showMessage(
            "entryMessage",
            "Please enter Admission No.",
            "error"
        );

        return;

    }

    if(!studentName){

        showMessage(
            "entryMessage",
            "Please load student first.",
            "error"
        );

        return;

    }


    const rows =
        document.querySelectorAll(".subject-row");

    const marks=[];

    let totalMax=0;
    let obtained=0;

    rows.forEach(row=>{

        const subject =
            row.querySelector(".subject-name").value;

        const max =
            Number(
                row.querySelector(".max-marks").value
            ) || 0;

        const got =
            Number(
                row.querySelector(".obtained-marks").value
            ) || 0;

        if(subject){

            marks.push({

                subject:subject,
                max:max,
                obtained:got,
                percentage:
                    max>0
                    ? ((got/max)*100).toFixed(2)
                    : 0

            });

            totalMax += max;
            obtained += got;

        }

    });


    if(!marks.length){

        showMessage(
            "entryMessage",
            "Please add at least one subject.",
            "error"
        );

        return;

    }


    const percentage =
        totalMax>0
        ? (obtained/totalMax)*100
        : 0;

    const grade =
        getGrade(percentage);

    const result =
        percentage>=33
        ? "PASS"
        : "FAIL";


    const workingDays =
        Number(
            document.getElementById("workingDays").value
        ) || 0;

    const presentDays =
        Number(
            document.getElementById("presentDays").value
        ) || 0;

    const absentDays =
        Number(
            document.getElementById("absentDays").value
        ) || 0;

    const attendancePercentage =
        Number(
            document.getElementById("attendancePercentage").value
        ) || 0;

    const remarks =
        document.getElementById("remarks").value.trim();


    const payload={

        student_id:admissionNo,

        admission_no:admissionNo,

        student_name:studentName,

        father_name:fatherName,

        class_name:className,

        section:section,

        session:session,

        exam_type:examType,

        marks:marks,

        total_max:totalMax,

        obtained_marks:obtained,

        percentage:Number(
            percentage.toFixed(2)
        ),

        grade:grade,

        result:result,

        working_days:workingDays,

        present_days:presentDays,

        absent_days:absentDays,

        attendance_percentage:
            Number(
                attendancePercentage.toFixed(2)
            ),

        remarks:remarks,

        updated_at:new Date().toISOString()

    };


    const {
        data:existing,
        error:findError
    } = await supabaseClient
        .from("student_results")
        .select("id")
        .eq("admission_no",admissionNo)
        .eq("session",session)
        .eq("exam_type",examType)
        .limit(1);


    if(findError){

        showMessage(
            "entryMessage",
            findError.message,
            "error"
        );

        return;

    }


    let error=null;


    if(existing && existing.length){

        const response =
            await supabaseClient
            .from("student_results")
            .update(payload)
            .eq("id",existing[0].id);

        error=response.error;

    }else{

        const response =
            await supabaseClient
            .from("student_results")
            .insert([payload]);

        error=response.error;

    }


    if(error){

        showMessage(
            "entryMessage",
            "Save error: "+error.message,
            "error"
        );

        return;

    }


    showMessage(
        "entryMessage",
        examType+" result saved successfully.",
        "success"
    );

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(value===null || value===undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

                `;

                finalObt +=
                    Number(m.obtained)||0;

                finalMax +=
                    Number(m.max)||0;

            }else{

                cells += `
                    <td>-</td>
                `;

            }

        });


        const subjectObt =
            ["FA-1","SA-1","FA-2","SA-2"]
            .reduce((sum,exam)=>{

                return sum +
                    Number(
                        map[subject][exam]?.obtained
                    ) || 0;

            },0);


        const subjectMax =
            ["FA-1","SA-1","FA-2","SA-2"]
            .reduce((sum,exam)=>{

                return sum +
                    Number(
                        map[subject][exam]?.max
                    ) || 0;

            },0);


        const pct =
            subjectMax>0
            ? ((subjectObt/subjectMax)*100).toFixed(1)
            : "0.0";


        rows += `

            <tr>

                <td>${index+1}</td>

                <td style="text-align:left;">
                    ${escapeHTML(subject)}
                </td>

                ${cells}

                <td>
                    ${subjectObt}/${subjectMax}
                </td>

                <td>
                    ${pct}%
                </td>

            </tr>

        `;

    });


    const overallPercentage =
        finalMax>0
        ? (finalObt/finalMax)*100
        : 0;


    const latest =
        results[results.length-1] || results[0];


    const attendance =
        Number(
            latest?.attendance_percentage
        ) || 0;


    return `

        <div class="report-page">

            ${reportHeader(title,latest,student)}

            <table class="marks-table">

                <thead>

                    <tr>

                        <th>Sr.</th>

                        <th>Subject</th>

                        <th>FA-1<br>Obt/Max</th>

                        <th>SA-1<br>Obt/Max</th>

                        <th>FA-2<br>Obt/Max</th>

                        <th>SA-2<br>Obt/Max</th>

                        <th>FINAL<br>Obt/Max</th>

                        <th>%</th>

                    </tr>

                </thead>

                <tbody>

                    ${rows}

                </tbody>

                <tfoot>

                    <tr>

                        <td colspan="2">
                            FINAL TOTAL
                        </td>

                        <td colspan="4">
                            ${finalObt} / ${finalMax}
                        </td>

                        <td>
                            ${finalObt}/${finalMax}
                        </td>

                        <td>
                            ${overallPercentage.toFixed(2)}%
                        </td>

                    </tr>

                </tfoot>

            </table>


            <div class="summary-grid">

                <div class="summary-box">

                    Final Total

                    <strong>
                        ${finalObt}/${finalMax}
                    </strong>

                </div>

                <div class="summary-box">

                    Percentage

                    <strong>
                        ${overallPercentage.toFixed(2)}%
                    </strong>

                </div>

                <div class="summary-box">

                    Grade

                    <strong>
                        ${getGrade(overallPercentage)}
                    </strong>

                </div>

                <div class="summary-box">

                    Result

                    <strong>
                        ${overallPercentage>=33 ? "PASS":"FAIL"}
                    </strong>

                </div>

            </div>


            <div class="attendance-box">

                <strong>Attendance:</strong>

                Working Days:
                ${latest?.working_days || 0}

                &nbsp;&nbsp;|&nbsp;&nbsp;

                Present:
                ${latest?.present_days || 0}

                &nbsp;&nbsp;|&nbsp;&nbsp;

                Absent:
                ${latest?.absent_days || 0}

                &nbsp;&nbsp;|&nbsp;&nbsp;

                Attendance:
                ${attendance.toFixed(2)}%

            </div>


            <div class="remarks-box">

                <strong>Remarks:</strong>

                ${escapeHTML(
                    latest?.remarks ||
                    "Good performance."
                )}

            </div>


            <div class="signature-area">

                <div class="signature">
                    Class Teacher
                </div>

                <div class="signature">
                    Principal
                </div>

                <div class="signature">
                    Parent / Guardian
                </div>

            </div>


            <div class="footer-note">
                This is a computer generated final result.
            </div>

        </div>

    `;

}


/* =========================================================
   STUDENT RESULT
========================================================= */

async function showStudentResult(){

    const admissionNo =
        document
        .getElementById("resultAdmissionNo")
        .value.trim();

    const session =
        document
        .getElementById("resultSession")
        .value;

    const exam =
        document
        .getElementById("resultExam")
        .value;


    if(!admissionNo){

        alert("Please enter Admission No.");

        return;

    }


    const student =
        await getStudentInfo(admissionNo);


    if(!student){

        alert("Student not found.");

        return;

    }


    let html="";


    if(
        exam==="FA1-SA1"
    ){

        const r1 =
            await getExamResult(
                admissionNo,
                session,
                "FA-1"
            );

        const r2 =
            await getExamResult(
                admissionNo,
                session,
                "SA-1"
            );


        const results =
            [r1,r2].filter(Boolean);


        if(!results.length){

            alert("Result not found.");

            return;

        }


        html =
            createCombinedReport(
                results,
                "FA-1 + SA-1 RESULT",
                student
            );

    }

    else if(
        exam==="FA2-SA2"
    ){

        const r1 =
            await getExamResult(
                admissionNo,
                session,
                "FA-2"
            );

        const r2 =
            await getExamResult(
                admissionNo,
                session,
                "SA-2"
            );


        const results =
            [r1,r2].filter(Boolean);


        if(!results.length){

            alert("Result not found.");

            return;

        }


        html =
            createCombinedReport(
                results,
                "FA-2 + SA-2 RESULT",
                student
            );

    }

    else if(
        exam==="FINAL"
    ){

        const results=[];


        for(
            const examType
            of ["FA-1","SA-1","FA-2","SA-2"]
        ){

            const r =
                await getExamResult(
                    admissionNo,
                    session,
                    examType
                );

            if(r){

                results.push(r);

            }

        }


        if(!results.length){

            alert(
                "Final result data not found."
            );

            return;

        }


        html =
            createCombinedReport(
                results,
                "FINAL RESULT",
                student
            );

    }

    else{

        const r =
            await getExamResult(
                admissionNo,
                session,
                exam
            );


        if(!r){

            alert(
                exam+" result not found."
            );

            return;

        }


        html =
            createSingleReport(
                r,
                exam+" RESULT",
                student
            );

    }


    window.currentResultHTML=html;


    document
        .getElementById("studentResultPreview")
        .innerHTML = `

        <div class="report-actions">

            <button
                class="print-result-btn"
                onclick="printCurrentResult()">
                🖨️ PRINT RESULT
            </button>

        </div>

        ${html}

    `;

}


/* =========================================================
   PRINT CURRENT RESULT
========================================================= */

function printCurrentResult(){

    if(!window.currentResultHTML){

        alert(
            "Please open/view the result first."
        );

        return;

    }


    const printArea =
        document.getElementById("printArea");


    printArea.innerHTML =
        window.currentResultHTML;


    printArea.style.display="block";


    setTimeout(function(){

        window.print();

    },500);

}


/* =========================================================
   CLASS RESULT
========================================================= */

async function showClassResult(){

    const session =
        document
        .getElementById("classResultSession")
        .value;

    const className =
        document
        .getElementById("classResultClass")
        .value;

    const exam =
        document
        .getElementById("classResultExam")
        .value;


    if(!className){

        alert("Please select class.");

        return;

    }


    let query =
        supabaseClient
        .from("student_results")
        .select("*")
        .eq("session",session)
        .eq("class_name",className);


    if(exam!=="FINAL"){

        query =
            query.eq("exam_type",exam);

    }


    const {
        data,
        error
    } =
        await query;


    if(error){

        alert(error.message);

        return;

    }


    if(!data || !data.length){

        document
            .getElementById("classResultPreview")
            .innerHTML =
            `<div class="message error"
                style="display:block;">
                No result found.
            </div>`;

        return;

    }


    const students={};


    data.forEach(r=>{

        if(!students[r.admission_no]){

            students[r.admission_no]=r;

        }

    });


    let rows="";


    const list =
        Object.values(students)
        .sort(
            (a,b)=>
                Number(b.percentage||0) -
                Number(a.percentage||0)
        );


    list.forEach((r,index)=>{

        rows += `

            <tr>

                <td>${index+1}</td>

                <td>
                    ${escapeHTML(r.admission_no)}
                </td>

                <td style="text-align:left;">
                    ${escapeHTML(r.student_name)}
                </td>

                <td>
                    ${escapeHTML(r.section)}
                </td>

                <td>
                    ${Number(r.obtained_marks||0)}
                    /
                    ${Number(r.total_max||0)}
                </td>

                <td>
                    ${Number(r.percentage||0).toFixed(2)}%
                </td>

                <td>
                    ${escapeHTML(r.grade||"-")}
                </td>

                <td>
                    ${escapeHTML(r.result||"-")}
                </td>

                <td>
                    <button
                        class="btn btn-info"
                        onclick="openStudentFromClass('${escapeHTML(r.admission_no)}','${session}','${exam}')">
                        View
                    </button>
                </td>

            </tr>

        `;

    });


    document
        .getElementById("classResultPreview")
        .innerHTML = `

        <div class="card">

            <h3>
                ${escapeHTML(className)}
                - ${escapeHTML(exam)}
            </h3>

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>Rank</th>
                            <th>Admission No.</th>
                            <th>Student Name</th>
                            <th>Section</th>
                            <th>Total</th>
                            <th>%</th>
                            <th>Grade</th>
                            <th>Result</th>
                            <th>View</th>

                        </tr>

                    </thead>

                    <tbody>

                        ${rows}

                    </tbody>

                </table>

            </div>

        </div>

    `;

}


/* =========================================================
   OPEN STUDENT FROM CLASS
========================================================= */

function openStudentFromClass(
    admissionNo,
    session,
    exam
){

    document
        .getElementById("resultAdmissionNo")
        .value=admissionNo;

    document
        .getElementById("resultSession")
        .value=session;

    document
        .getElementById("resultExam")
        .value =
            exam==="FINAL"
            ? "FINAL"
            : exam;

    showTab(
        "studentTab",
        document.querySelectorAll(".tab-btn")[1]
    );

    showStudentResult();

}
