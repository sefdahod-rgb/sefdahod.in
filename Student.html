<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Management - Rainbow Public School</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Segoe UI; margin:0; padding:0}
body{background:#eef2f7; padding:10px}
.header{background:#b30000; color:#fff; text-align:center; padding:12px; border-radius:8px 8px 0 0}
.header h1{font-size:26px}
.top-nav{background:#7f1d1d; padding:8px; text-align:center; border-radius:0 0 8px 8px; margin-bottom:10px}
.top-nav a{color:#fff; text-decoration:none; margin:5px; padding:6px 12px; background:#b30000; border-radius:5px; display:inline-block; font-size:13px}
.card{background:#fff; margin:10px 0; padding:15px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card h3{background:#1e3a8a; color:#fff; padding:8px 12px; border-radius:6px; margin:-15px -15px 15px -15px; font-size:15px}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:10px}
label{font-size:11px; font-weight:bold; color:#1e293b; display:block; margin-bottom:3px}
input,select,textarea{width:100%; padding:7px 9px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px; background:#fffef0}
.btn{padding:7px 14px; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:bold; margin:2px; color:#fff}
.btn-b{background:#1e3a8a} .btn-g{background:#16a34a} .btn-r{background:#dc2626} .btn-y{background:#d97706}
.photo-box{border:2px dashed #b30000; padding:10px; text-align:center; border-radius:8px; background:#fff5f5}
.photo-box img{width:120px; height:140px; object-fit:cover; border:2px solid #b30000; border-radius:6px}
.search-bar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.search-bar input{flex:1; min-width:200px; padding:10px; border:2px solid #b30000; border-radius:8px; background:#fff}
table{width:100%; border-collapse:collapse; font-size:12px}
th,td{border:1px solid #cbd5e1; padding:6px 8px; text-align:left}
th{background:#1e3a8a; color:#fff; font-size:11px}
tr:nth-child(even){background:#f8fafc}
.s-photo{width:35px; height:35px; border-radius:50%; object-fit:cover; border:1px solid #b30000}
</style>
</head>
<body>

<div class="header"><h1>RAINBOW PUBLIC SCHOOL</h1><p>Conduct by Shubhi Education Foundation</p></div>
<div class="top-nav"><a href="admin.html">Admin</a><a href="certificates.html">Certificates</a></div>

<div class="card">
<h3>🔍 Search - Admission No. Likho Auto Aa Jayega</h3>
<div class="search-bar">
<input type="text" id="searchAdmission" placeholder="Admission No. likho... auto fill" oninput="autoSearch(this.value)">
<input type="text" id="searchName" placeholder="Name se search..." oninput="filterTable()">
<button class="btn btn-b" onclick="filterTable()">Search</button>
<button class="btn btn-y" onclick="clearSearch()">Clear</button>
</div>
</div>

<div class="card">
<h3>📝 Student Form - Full Detail with Photo (LC Save)</h3>
<div style="display:grid; grid-template-columns:1fr 220px; gap:15px">
<div>
<div class="form-grid">
<div><label>Admission Number *</label><input type="text" id="admission_no" placeholder="RPS001" onblur="checkAdmission()"></div>
<div><label>Roll Number</label><input type="text" id="roll_no"></div>
<div><label>Admission Date</label><input type="date" id="admission_date"></div>
<div><label>Student Name *</label><input type="text" id="student_name"></div>
<div><label>Father's Name *</label><input type="text" id="father_name"></div>
<div><label>Mother's Name</label><input type="text" id="mother_name"></div>
<div><label>DOB</label><input type="date" id="dob" onchange="calcAge()"></div>
<div><label>Age</label><input type="text" id="age" readonly></div>
<div><label>Gender</label><select id="gender"><option>Male</option><option>Female</option></select></div>
<div><label>Class *</label><select id="class_name"><option value="">Select</option><option>Nursery</option><option>LKG</option><option>UKG</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
<div><label>Section</label><select id="section"><option>A</option><option>B</option><option>C</option></select></div>
<div><label>Mobile *</label><input type="text" id="mobile"></div>
<div><label>Aadhar</label><input type="text" id="aadhar"></div>
<div style="grid-column:span 2"><label>Address</label><textarea id="address" rows="2"></textarea></div>
</div>
</div>
<div class="photo-box">
<img id="previewPhoto" src="https://via.placeholder.com/120x140?text=PHOTO">
<input type="file" id="photoInput" accept="image/*" style="margin-top:8px" onchange="previewImage(event)">
<button class="btn btn-r" style="margin-top:8px; width:100%" onclick="removePhoto()">Remove</button>
<input type="hidden" id="photoBase64"><input type="hidden" id="editId">
</div>
</div>
