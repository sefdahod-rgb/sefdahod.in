
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password - SEF Dahod</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#004080,#0F9D58);font-family:Segoe UI,Arial,sans-serif;padding:20px;box-sizing:border-box}
.box{background:#fff;padding:28px;border-radius:14px;width:100%;max-width:380px;box-sizing:border-box}
input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;border-radius:7px;font-size:16px}
input{border:1px solid #ccc}
button{background:#0F9D58;color:#fff;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
#msg{overflow-wrap:anywhere;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>Set New Password</h2>
<p>Shubhi Education Foundation, Dahod</p>
<form id="resetForm">
<input id="pass1" type="password" minlength="8" autocomplete="new-password" placeholder="New Password (minimum 8 characters)" required>
<input id="pass2" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm New Password" required>
<button id="saveBtn" type="submit">Save New Password</button>
</form>
<p id="msg" role="status"></p>
</div>
<script>
const client = window.supabase.createClient(
 "https://kqahcvaoxnmxfcgyyync.supabase.co",
 "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYWhjdmFveG5teGZjZ3l5eW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODQ3NTksImV4cCI6MjA5MDQ2MDc1OX0.H_aABgpGglAMnVaDkBZU7xihvhHW8XT3U9PoR2VsFWg";

);
const msg=document.getElementById("msg");
const form=document.getElementById("resetForm");
const btn=document.getElementById("saveBtn");
let recoveryReady=false;

function show(text,ok=false){
 msg.textContent=text;
 msg.style.color=ok?"#087443":"#b91c1c";
}

async function init(){
 const hashParams=new URLSearchParams(location.hash.slice(1));
 const queryParams=new URLSearchParams(location.search);

 if(hashParams.get("error") || hashParams.get("error_code")){
   show("Reset link invalid ya expire ho gaya. Naya reset email chahiye hoga.");
   return;
 }

 // Support Supabase PKCE recovery links
 const code=queryParams.get("code");
 if(code){
   const {error}=await client.auth.exchangeCodeForSession(code);
   if(error){
     show("Reset link expire ya invalid hai. Naya reset link use karein.");
     return;
   }
 }

 // Support recovery links that return an access token in URL hash
 const access_token=hashParams.get("access_token");
 const refresh_token=hashParams.get("refresh_token");
 if(access_token && refresh_token){
   const {error}=await client.auth.setSession({access_token,refresh_token});
   if(error){
     show("Reset session valid nahi hai. Naya reset link use karein.");
     return;
   }
 }

 const {data}=await client.auth.getSession();
 if(data.session){
   recoveryReady=true;
   show("Naya password enter karein.",true);
 }else{
   show("Valid recovery link se is page ko kholein. Link expire ho sakta hai.");
 }
}

form.addEventListener("submit",async e=>{
 e.preventDefault();
 if(!recoveryReady){
   show("Pehle valid Reset Email link se page kholein.");
   return;
 }
 const p1=document.getElementById("pass1").value;
 const p2=document.getElementById("pass2").value;
 if(p1.length<8){show("Password kam se kam 8 characters ka hona chahiye.");return;}
 if(p1!==p2){show("Dono password match nahi karte.");return;}

 btn.disabled=true;
 show("Password save ho raha hai...",true);
 const {error}=await client.auth.updateUser({password:p1});
 btn.disabled=false;

 if(error){
   show("Password save nahi hua: "+error.message);
   return;
 }

 await client.auth.signOut();
 show("Password successfully change ho gaya. Ab Login page kholein.",true);
 const link=document.createElement("a");
 link.href="login.html";
 link.textContent="Go to Login";
 link.style.display="block";
 link.style.marginTop="15px";
 msg.appendChild(document.createElement("br"));
 msg.appendChild(link);
});

init().catch(()=>show("Reset link process nahi ho saka. Dobara valid link se kholein."));
</script>
</body>
</html>
