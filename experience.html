/* DATE FORMAT */

function formatDate(date){

  if(!date) return "-";

  const d = new Date(date);

  const day =
    String(d.getDate()).padStart(2,"0");

  const month =
    String(d.getMonth()+1).padStart(2,"0");

  const year =
    d.getFullYear();

  return `${day}-${month}-${year}`;
}

/* LOAD DATA */

async function load(){

  const { data, error } =
    await client
      .from("experiences")
      .select("*")
      .order("id",{ascending:false});

  if(error){

    console.log(error);

    alert("Error loading data");

    return;
  }

  allExperiences = data || [];

  render(allExperiences);
}

/* RENDER TABLE */

function render(data){

  const table =
    document.getElementById("table");

  table.innerHTML = `
  <tr>
    <th>Certificate No</th>
    <th>Name</th>
    <th>Photo</th>
    <th>Type</th>
    <th>Designation</th>
    <th>Joining</th>
    <th>Ending</th>
    <th>Salary</th>
    <th>Actions</th>
  </tr>
  `;

  if(data.length===0){

    table.innerHTML += `
    <tr>
      <td colspan="9">
        No Data Found
      </td>
    </tr>
    `;

    return;
  }

  data.forEach(a=>{

    table.innerHTML += `
    <tr>

      <td>${a.experience_no || "-"}</td>

      <td>${a.name || "-"}</td>

        ${

      <td>${a.designation || "-"}</td>

      <td>₹${a.salary || 0}</td>

      <td>

        <button onclick="editExperience(${a.id})">

          Delete
        </button>

        <button onclick="printExperience(${a.id})">
          Print
        </button>

      </td>

    `;

}

/* ADD EXPERIENCE */

async function addExperience(){

  const name =
    document.getElementById("name").value.trim();

  const designation =
    document.getElementById("designation").value.trim();

  const type =
    document.getElementById("type").value;

  const joining_date =
    document.getElementById("joining_date").value;

  const ending_date =
    document.getElementById("ending_date").value;

  const salary =
    Number(document.getElementById("salary").value) || 0;

  const remarks =
    document.getElementById("remarks").value.trim();

  const photoFile =
    document.getElementById("photo").files[0];

  if(!name || !designation || !joining_date){

    alert("Please fill required fields");

    return;
  }

  let photoUrl = "";

  /* PHOTO UPLOAD */

  if(photoFile){

    const fileName =
      Date.now() + "_" + photoFile.name;

    const { error: uploadError } =
      await client.storage
        .from("experience")
        .upload(fileName, photoFile);

    if(uploadError){

      console.log(uploadError);

    }else{

      photoUrl =
        client.storage
          .from("experience")
          .getPublicUrl(fileName)
          .data.publicUrl;
    }
  }

  const experience_no =
    "EXP-" + Date.now();

  /* SAVE */

  const { error } =
    await client
      .from("experiences")
      .insert([{

        experience_no,
        name,
        designation,
        type,
        joining_date,
        ending_date,
        salary,
        remarks,
        photo: photoUrl

      }]);

 if(error){

  console.log(error);

  alert(error.message);

  return;
}

    
  alert("Experience Certificate Created ✅");

  /* CLEAR FORM */

  document.getElementById("name").value = "";
  document.getElementById("designation").value = "";
  document.getElementById("joining_date").value = "";
  document.getElementById("ending_date").value = "";
  document.getElementById("salary").value = "";
  document.getElementById("remarks").value = "";
  document.getElementById("photo").value = "";

  load();
}

/* DELETE */

async function deleteExperience(id){

  if(!confirm("Delete this certificate?"))
    return;

  await client
    .from("experiences")
    .delete()
    .eq("id",id);

  load();
}

/* EDIT */

async function editExperience(id){

  const a =
    allExperiences.find(x=>x.id===id);

  if(!a) return;

  const newName =
    prompt("Name",a.name);

  if(!newName) return;

  const newDesignation =
    prompt("Designation",a.designation);

  const newSalary =
    prompt("Salary",a.salary);

  await client
    .from("experiences")
    .update({

      name:newName,
      designation:newDesignation,
      salary:newSalary

    })
    .eq("id",id);

  load();
}

/* EXPORT CSV */

function exportCSV(){

  let csv =
  "Certificate No,Name,Type,Designation,Joining Date,Ending Date,Salary\n";

  allExperiences.forEach(a=>{

    csv +=
    `${a.experience_no},${a.name},${a.type},${a.designation},${formatDate(a.joining_date)},${formatDate(a.ending_date)},${a.salary}\n`;

  });

  const blob =
    new Blob([csv],{
      type:"text/csv"
    });

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download =
    "experience_certificates.csv";

  link.click();
}

/* SEARCH */

document.getElementById("search")
.addEventListener("input",function(){

  const val =
    this.value.toLowerCase();

  render(

    allExperiences.filter(a=>

      (a.name || "")
      .toLowerCase()
      .includes(val)

    )

  );

});
