<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Certificates Management - SEF Dahod</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{ margin:0; font-family:Segoe UI; background:#f3f4f6; }
.header{ background:#2563eb; color:#fff; text-align:center; padding:15px; }
.header img{ width:60px; }
nav{ text-align:center; padding:10px; background:#1d4ed8; }
nav a{ color:#fff; text-decoration:none; margin:5px; padding:8px 14px; display:inline-block; background:#2563eb; border-radius:6px; }
.card{ background:#fff; margin:15px; padding:15px; border-radius:10px; }
input,select,textarea{ padding:8px; margin:5px; border:1px solid #ccc; border-radius:6px; }
textarea{ width:95%; }
button{ padding:8px 12px; border:none; border-radius:6px; cursor:pointer; background:#2563eb; color:#fff; margin:2px; }
button:hover{ opacity:0.9; }
table{ width:100%; border-collapse:collapse; margin-top:15px; font-size:14px; }
th,td{ border:1px solid #ddd; padding:8px; text-align:center; }
th{ background:#2563eb; color:#fff; }
.search{ width:98%; padding:10px; margin-top:10px; border:1px solid #ccc; border-radius:6px; }
@media print{ nav,.no-print,button,input,select,textarea{ display:none; } }
</style>
</head>
<body>

<script>
// Login check
if(localStorage.getItem("isAdmin")!=="yes"){
  localStorage.setItem("redirectAfterLogin","certificates.html");
  location.href="login.html";
}
</script>

<div class="header">
<img src="logo.png">
<h2>Shubhi Education Foundation</h2>
<p>Certificates Management System</p>
</div>

<nav class="no-print">
<a href="admin.html">Admin</a>
<a href="members.html">Members</a>
<a href="index.html">Home</a>
<a href="#" onclick="logout()">Logout</a>
</nav>

<div class="card no-print">
<h3>Issue New Certificate</h3>
<input type="text" id="name" placeholder="Recipient Name" style="width:200px;">
<select id="type">
<option value="Membership Certificate">Membership Certificate</option>
<option value="Achievement Certificate">Achievement Certificate</option>
<option value="Volunteer Certificate">Volunteer Certificate</option>
<option value="Participation Certificate">Participation Certificate</option>
<option value="Competition Certificate">🏆 Competition Certificate</option>
</select>
<input type="date" id="issue_date">
<br>
<div id="competitionBox" style="display:none; margin-top:10px;">
<label><b>Competition Name</b></label><br>
<input type="text" id="competition_name" placeholder="Example: Drawing / Essay / Quiz Competition" style="width:300px;">
</div>
<textarea id="remarks" placeholder="Remarks / Achievement Details"></textarea>
<br>
<button onclick="addCertificate()">Issue Certificate</button>
</div>

<div class="card">
<h3>Certificates List</h3>
<input type="text" id="search" class="search no-print" placeholder="Search by Name or Certificate No...">
<button onclick="exportCSV()" class="no-print">Export CSV</button>
<button onclick="window.print()" class="no-print">Print List</button>
<button onclick="load()" class="no-print">🔄 Refresh</button>
<div id="loader" style="text-align:center; padding:20px; display:none;">Loading...</div>
<table id="table"></table>
</div>

<script>
const client = supabase.createClient(
"https://kqahcvaoxnmxfcgyyync.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYWhjdmFveG5teGZjZ3l5eW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODQ3NTksImV4cCI6MjA5MDQ2MDc1OX0.H_aABgpGglAMnVaDkBZU7xihvhHW8XT3U9PoR2VsFWg"
);

let allCertificates=[];

function formatDate(dateString){
  if(!dateString) return "-";
  try{
    return new Date(dateString).toLocaleDateString('en-GB');
  }catch(e){ return dateString; }
}

// FIX 1: Competition Box Show/Hide - Bahar nikala
document.getElementById("type").addEventListener("change", function(){
  const box = document.getElementById("competitionBox");
  if(this.value=="Competition Certificate"){
    box.style.display="block";
  }else{
    box.style.display="none";
    document.getElementById("competition_name").value="";
  }
});

async function load(){
  document.getElementById("loader").style.display="block";
  const { data, error } = await client
    .from("certificates")
    .select("*")
    .order("id",{ascending:false});

  document.getElementById("loader").style.display="none";

  if(error){
    console.log(error);
    alert("Error loading: " + error.message);
    return;
  }

  allCertificates = data || [];
  render(allCertificates);
}

function render(data){
  const table = document.getElementById("table");
  table.innerHTML = `
  <tr>
    <th>Certificate No</th>
    <th>Name</th>
    <th>Type</th>
    <th>Competition</th>
    <th>Issue Date</th>
    <th>Remarks</th>
    <th>Actions</th>
  </tr>`;

  if(data.length===0){
    table.innerHTML += `<tr><td colspan="7">No certificates found</td></tr>`;
    return;
  }

  data.forEach(c=>{
    // FIX 2: Print button ka syntax error theek kiya - safe escaping
    table.innerHTML += `
    <tr>
      <td>${c.cert_no || "-"}</td>
      <td>${c.name || "-"}</td>
      <td>${c.type || "-"}</td>
      <td>${c.competition_name || "-"}</td>
      <td>${formatDate(c.issue_date)}</td>
      <td>${c.remarks || "-"}</td>
      <td>
        <button onclick="editCertificate(${c.id})">Edit</button>
        <button onclick="deleteCertificate(${c.id})" style="background:#ef4444;">Delete</button>
        <button onclick="printCertificate(${c.id})" style="background:#16a34a;">Print</button>
      </td>
    </tr>`;
  });
}

async function addCertificate(){
  const name = document.getElementById("name").value.trim();
  const type = document.getElementById("type").value;
  const issue_date = document.getElementById("issue_date").value;
  const remarks = document.getElementById("remarks").value.trim();
  const competition_name = document.getElementById("competition_name").value.trim();

  if(!name){
    alert("Recipient name required");
    return;
  }

  const cert_no = "CERT-" + Date.now();

  const { error } = await client
    .from("certificates")
    .insert([{
      cert_no,
      name,
      type,
      issue_date: issue_date || new Date().toISOString().split('T')[0],
      remarks,
      competition_name
    }]);

  if(error){
    console.log(error);
    alert("Failed: " + error.message);
    return;
  }

  alert("Certificate issued successfully ✅");
  document.getElementById("name").value="";
  document.getElementById("issue_date").value="";
  document.getElementById("remarks").value="";
  document.getElementById("competition_name").value="";
  document.getElementById("competitionBox").style.display="none";
  load();
}

async function deleteCertificate(id){
  if(!confirm("Delete this certificate?")) return;
  const { error } = await client.from("certificates").delete().eq("id",id);
  if(error) alert(error.message);
  load();
}

async function editCertificate(id){
  const cert = allCertificates.find(x=>x.id===id);
  let newName = prompt("Recipient Name", cert.name);
  if(newName===null) return;
  let newRemarks = prompt("Remarks", cert.remarks);
  if(newRemarks===null) newRemarks = cert.remarks;
  let newComp = cert.competition_name || "";
  if(cert.type=="Competition Certificate"){
    newComp = prompt("Competition Name", cert.competition_name || "") || "";
  }

  const { error } = await client.from("certificates").update({
      name:newName,
      remarks:newRemarks,
      competition_name:newComp
    }).eq("id",id);

  if(error) alert(error.message);
  load();
}

document.getElementById("search").addEventListener("input", function(){
  const val = this.value.toLowerCase();
  render(allCertificates.filter(c =>
      (c.name || "").toLowerCase().includes(val) ||
      (c.cert_no || "").toLowerCase().includes(val) ||
      (c.type || "").toLowerCase().includes(val)
    ));
});

function exportCSV(){
  let csv = "Certificate No,Name,Type,Competition,Issue Date,Remarks\n";
  allCertificates.forEach(c=>{
    csv += `"${c.cert_no}","${c.name}","${c.type}","${c.competition_name||''}","${formatDate(c.issue_date)}","${(c.remarks||'').replace(/"/g,'""')}"\n`;
  });
  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "certificates.csv";
  a.click();
}

function printCertificate(id){
  const c = allCertificates.find(x=>x.id===id);
  if(!c) return;

  const w = window.open("", "_blank");
  w.document.write(`
    <html>
    <head>
      <title>Certificate - ${c.name}</title>
      <style>
        body{ margin:0; padding:0; font-family:Georgia, serif; background:#f8f5e9; }
        .certificate{ width:900px; margin:20px auto; padding:60px; border:16px double #d4af37; text-align:center; background: linear-gradient(rgba(255,253,245,0.94), rgba(255,253,245,0.94)), url('logo.png') center center no-repeat; background-size:300px; position:relative; box-shadow:0 0 35px rgba(0,0,0,0.25); }
        .logo{ width:90px; }
        .watermark{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:400px; opacity:0.06; z-index:0; pointer-events:none; }
        h1{ font-size:42px; color:#1d4ed8; margin:10px 0; }
        .recipient{ font-size:46px; color:#7f1d1d; font-weight:bold; margin:15px 0; text-decoration:underline; position:relative; z-index:1; }
        .comp-name{ font-size:28px; font-weight:bold; color:#dc2626; margin:15px 0; }
        .print-btn{ text-align:center; margin:20px; }
        .print-btn button{ padding:12px 25px; background:#2563eb; color:white; border:none; border-radius:8px; cursor:pointer; font-size:18px; }
        @media print{ .print-btn{ display:none; } }
      </style>
    </head>
    <body>
      <div class="certificate">
        <img src="${window.location.origin}/logo.png" class="watermark">
        <img src="logo.png" class="logo">
        <h1>Shubhi Education Foundation</h1>
        <p style="font-size:18px;">Under Indian Society Act 1860 Guj./2249/DHD. & Mumbai Public Trust Act 1950 F/2247/DHD</p>
        <h2 style="color:#d97706; font-size:36px;">${c.type}</h2>
        ${c.type=="Competition Certificate" && c.competition_name ? `<div class="comp-name">🏆 ${c.competition_name}</div>` : ``}
        <p style="font-size:24px;">This is proudly presented to</p>
        <div class="recipient">${c.name}</div>
        <p style="font-size:20px;">In recognition of valuable contribution, dedication and support.</p>
        <p style="font-size:18px; margin-top:10px;">${c.remarks || ''}</p>
        <p style="font-size:16px; margin-top:20px;">Issued on: ${new Date(c.issue_date).toLocaleDateString('en-GB')} | Cert No: ${c.cert_no}</p>
        <div style="display:flex; justify-content:space-between; margin-top:60px; font-size:18px;">
          <div>___________________<br>Director Signature</div>
          <div>___________________<br>Official Seal</div>
        </div>
      </div>
      <div class="print-btn"><button onclick="window.print()">Download / Print Certificate</button></div>
    </body>
    </html>
  `);
  w.document.close();
}

// FIX 3: Logout properly
function logout(){
  localStorage.removeItem("isAdmin");
  localStorage.removeItem("redirectAfterLogin");
  location.href="login.html";
}

load();
</script>

</body>
</html>
