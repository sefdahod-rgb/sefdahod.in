<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC Management - Rainbow Public School</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Times New Roman', serif; }
        body { background: #f0f0f0; padding: 0; margin: 0; }
     .admin-header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
     .admin-header h3 { margin: 0; font-size: 20px; }
     .breadcrumb { background: #ecf0f1; padding: 10px 20px; font-size: 14px; }
     .breadcrumb a { color: #3498db; text-decoration: none; }
     .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
     .controls { background: white; padding: 15px; margin-bottom: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
     .btn { padding: 8px 16px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
     .btn-primary { background: #3498db; color: white; }
     .btn-success { background: #27ae60; color: white; }
     .btn-danger { background: #e74c3c; color: white; }
     .btn-warning { background: #f39c12; color: white; }
     .btn-secondary { background: #95a5a6; color: white; }
     .btn:hover { opacity: 0.9; }
     .btn:disabled { opacity: 0.5; cursor: not-allowed; }

     .certificate { background: #fffef5; border: 3px double #000; padding: 20px; margin: 20px 0; position: relative; }
     .cert-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; }
     .cert-header h1 { color: #b30000; margin: 5px 0; font-size: 28px; }
     .cert-header p { margin: 2px 0; font-size: 13px; }
     .cert-title { text-align: center; font-size: 24px; font-weight: bold; margin: 10px 0; font-family: 'Brush Script MT', cursive; color: #b30000; }

     .cert-body { margin-top: 15px; }
     .cert-row { display: flex; border-bottom: 1px solid #000; padding: 6px 0; }
     .cert-row.label { width: 45%; font-weight: bold; }
     .cert-row.value { width: 55%; border-bottom: 1px dotted #000; }

     .cert-footer { margin-top: 30px; display: flex; justify-content: space-between; }
     .sign-box { text-align: center; width: 30%; }
     .sign-line { border-top: 1px solid #000; margin-top: 40px; }

     .dise-code { position: absolute; top: 20px; right: 20px; border: 2px solid #b30000; border-radius: 50%; padding: 10px; text-align: center; font-size: 12px; }

     .table-list { width: 100%; background: white; border-collapse: collapse; margin-top: 20px; }
     .table-list th,.table-list td { border: 1px solid #ddd; padding: 8px; text-align: left; }
     .table-list th { background: #34495e; color: white; }

        @media print {
       .no-print,.admin-header,.breadcrumb { display: none!important; }
            body { background: white; padding: 0; }
       .certificate { border: 3px double #000; margin: 0; page-break-after: always; }
       .container { max-width: 100%; padding: 0; }
        }

     .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: white; padding: 20px; border-radius: 5px; }
     .form-group { display: flex; flex-direction: column; }
     .form-group label { font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
     .form-group input { padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; }
        #searchBox { padding: 8px; width: 300px; border: 1px solid #bdc3c7; border-radius: 4px; }
     .loader { text-align: center; padding: 20px; font-size: 18px; color: #3498db; }
     .alert { padding: 10px; margin: 10px 0; border-radius: 4px; }
     .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
     .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <!-- Admin Header with Back Button -->
    <div class="admin-header no-print">
        <h3>🎓 Rainbow Public School - Admin Panel</h3>
        <div>
            <a href="index.html" class="btn btn-secondary">← Back to Dashboard</a>
            <!-- ^^^ Yahan apne admin dashboard ka HTML file name daalo -->
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb no-print">
        <a href="index.html">Dashboard</a> > <span>LC Management</span>
    </div>

    <div class="container">
        <div class="controls no-print">
            <h2 style="color: #2c3e50; margin-top:0;">School Leaving Certificate Management</h2>
            <div id="alertBox"></div>
            <button class="btn btn-primary" onclick="showForm()">+ Add New LC</button>
            <button class="btn btn-success" onclick="printCurrentLC()" id="printBtn" style="display:none;">🖨 Print Current LC</button>
            <input type="text" id="searchBox" placeholder="Search by GR No. or Student Name..." onkeyup="searchLC()">
        </div>

        <div id="lcForm" style="display:none;" class="no-print">
            <h3 id="formTitle" style="color: #2c3e50;">Add New Leaving Certificate</h3>
            <div class="form-grid">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Sr. No.</label><input type="text" id="srNo"></div>
                <div class="form-group"><label>General Register No.*</label><input type="text" id="grNo" required></div>
                <div class="form-group"><label>Name of Pupil in Full*</label><input type="text" id="studentName" required></div>
                <div class="form-group"><label>Mother's Name</label><input type="text" id="motherName"></div>
                <div class="form-group"><label>Race and Caste</label><input type="text" id="caste"></div>
                <div class="form-group"><label>Place of Birth</label><input type="text" id="birthPlace"></div>
                <div class="form-group"><label>Date of Birth</label><input type="text" id="dob" placeholder="DD-MM-YYYY, EIGHTEENTH OCTOBER TWO THOUSAND SIXTEEN"></div>
                <div class="form-group"><label>Aadhar Card No.</label><input type="text" id="aadhar"></div>
                <div class="form-group"><label>UID Number</label><input type="text" id="uid"></div>
                <div class="form-group"><label>Last School Attended</label><input type="text" id="lastSchool"></div>
                <div class="form-group"><label>Date of Admission</label><input type="text" id="doa"></div>
                <div class="form-group"><label>Progress</label><input type="text" id="progress" value="GOOD"></div>
                <div class="form-group"><label>Conduct</label><input type="text" id="conduct" value="GOOD"></div>
                <div class="form-group"><label>Date of Leaving School</label><input type="text" id="dol"></div>
                <div class="form-group"><label>Standard in which studying</label><input type="text" id="standard"></div>
                <div class="form-group"><label>Reason of leaving School</label><input type="text" id="reason"></div>
                <div class="form-group"><label>Remarks</label><input type="text" id="remarks"></div>
                <div class="form-group"><label>Issue Date</label><input type="text" id="issueDate"></div>
                <div class="form-group"><label>DISE Code</label><input type="text" id="diseCode" value="24180107544"></div>
            </div>
            <br>
            <button class="btn btn-success" onclick="saveLC()" id="saveBtn">💾 Save LC</button>
            <button class="btn btn-danger" onclick="hideForm()">✖ Cancel</button>
        </div>

        <div id="loader" class="loader no-print" style="display:none;">Loading...</div>
        <div id="certificateArea"></div>

        <div class="no-print">
            <h3 style="color: #2c3e50;">All Leaving Certificates</h3>
            <table class="table-list" id="lcTable">
                <thead>
                    <tr>
                        <th>Sr No</th>
                        <th>GR No</th>
                        <th>Student Name</th>
                        <th>Standard</th>
                        <th>Leaving Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="lcTableBody"></tbody>
            </table>
        </div>
    </div>

<script>
// === SUPABASE CONFIG - YAHAN APNI DETAILS DAALO ===
const SUPABASE_URL = 'https://kqahcvaoxnmxfcgyyync.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYWhjdmFveG5teGZjZ3l5eW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODQ3NTksImV4cCI6MjA5MDQ2MDc1OX0.H_aABgpGglAMnVaDkBZU7xihvhHW8XT3U9PoR2VsFWg';
// ===================================================

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let lcData = [];
let currentLCId = null;

window.onload = async function() {
    await loadLCData();
}

function showAlert(message, type = 'success') {
    const alertBox = document.getElementById('alertBox');
    alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    setTimeout(() => alertBox.innerHTML = '', 3000);
}

function showLoader(show) {
    document.getElementById('loader').style.display = show? 'block' : 'none';
}

async function loadLCData() {
    showLoader(true);
    const { data, error } = await supabaseClient
  .from('leaving_certificates')
  .select('*')
  .order('created_at', { ascending: false });

    if (error) {
        showAlert('Error loading data: ' + error.message, 'error');
        console.error(error);
    } else {
        lcData = data;
        renderTable();
    }
    showLoader(false);
}

function showForm(id = null) {
    document.getElementById('lcForm').style.display = 'block';
    document.getElementById('certificateArea').innerHTML = '';
    document.getElementById('printBtn').style.display = 'none';

    if(id) {
        document.getElementById('formTitle').innerText = 'Edit Leaving Certificate';
        let lc = lcData.find(x => x.id === id);
        document.getElementById('editId').value = lc.id;
        document.getElementById('srNo').value = lc.sr_no || '';
        document.getElementById('grNo').value = lc.gr_no || '';
        document.getElementById('studentName').value = lc.student_name || '';
        document.getElementById('motherName').value = lc.mother_name || '';
        document.getElementById('caste').value = lc.caste || '';
        document.getElementById('birthPlace').value = lc.birth_place || '';
        document.getElementById('dob').value = lc.dob || '';
        document.getElementById('aadhar').value = lc.aadhar || '';
        document.getElementById('uid').value = lc.uid || '';
        document.getElementById('lastSchool').value = lc.last_school || '';
        document.getElementById('doa').value = lc.doa || '';
        document.getElementById('progress').value = lc.progress || 'GOOD';
        document.getElementById('conduct').value = lc.conduct || 'GOOD';
        document.getElementById('dol').value = lc.dol || '';
        document.getElementById('standard').value = lc.standard || '';
        document.getElementById('reason').value = lc.reason || '';
        document.getElementById('remarks').value = lc.remarks || '';
        document.getElementById('issueDate').value = lc.issue_date || '';
        document.getElementById('diseCode').value = lc.dise_code || '24180107544';
    } else {
        document.getElementById('formTitle').innerText = 'Add New Leaving Certificate';
        document.getElementById('lcForm').querySelectorAll('input').forEach(i => {
            if(i.id!== 'diseCode' && i.id!== 'progress' && i.id!== 'conduct') i.value = '';
        });
        document.getElementById('editId').value = '';
    }
    window.scrollTo(0, 0);
}

function hideForm() {
    document.getElementById('lcForm').style.display = 'none';
}

async function saveLC() {
    const grNo = document.getElementById('grNo').value.trim();
    const studentName = document.getElementById('studentName').value.trim();

    if(!grNo ||!studentName) {
        showAlert('GR No. and Student Name are required!', 'error');
        return;
    }

    document.getElementById('saveBtn').disabled = true;
    showLoader(true);

    let id = document.getElementById('editId').value;
    let lcObj = {
        sr_no: document.getElementById('srNo').value,
        gr_no: grNo,
        student_name: studentName,
        mother_name: document.getElementById('motherName').value,
        caste: document.getElementById('caste').value,
        birth_place: document.getElementById('birthPlace').value,
        dob: document.getElementById('dob').value,
        aadhar: document.getElementById('aadhar').value,
        uid: document.getElementById('uid').value,
        last_school: document.getElementById('lastSchool').value,
        doa: document.getElementById('doa').value,
        progress: document.getElementById('progress').value,
        conduct: document.getElementById('conduct').value,
        dol: document.getElementById('dol').value,
        standard: document.getElementById('standard').value,
        reason: document.getElementById('reason').value,
        remarks: document.getElementById('remarks').value,
        issue_date: document.getElementById('issueDate').value,
        dise_code: document.getElementById('diseCode').value
    };

    let result;
    if(id) {
        result = await supabaseClient
      .from('leaving_certificates')
      .update({...lcObj, updated_at: new Date()})
      .eq('id', id);
    } else {
        result = await supabaseClient
      .from('leaving_certificates')
      .insert([lcObj])
      .select();
    }

    if (result.error) {
        showAlert('Error: ' + result.error.message, 'error');
        console.error(result.error);
    } else {
        showAlert(id? 'LC Updated Successfully!' : 'LC Saved Successfully!');
        hideForm();
        await loadLCData();
        if (!id && result.data) viewLC(result.data[0].id);
    }

    document.getElementById('saveBtn').disabled = false;
    showLoader(false);
}

function renderTable() {
    let tbody = document.getElementById('lcTableBody');
    tbody.innerHTML = '';
    if(lcData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No records found</td></tr>';
        return;
    }
    lcData.forEach(lc => {
        tbody.innerHTML += `
            <tr>
                <td>${lc.sr_no || '-'}</td>
                <td>${lc.gr_no}</td>
                <td>${lc.student_name}</td>
                <td>${lc.standard || '-'}</td>
                <td>${lc.dol || '-'}</td>
                <td>
                    <button class="btn btn-primary" onclick="viewLC(${lc.id})">View</button>
                    <button class="btn btn-warning" onclick="showForm(${lc.id})">Edit</button>
                    <button class="btn btn-danger" onclick="deleteLC(${lc.id})">Delete</button>
                </td>
            </tr>
        `;
    });
}

function viewLC(id) {
    currentLCId = id;
    let lc = lcData.find(x => x.id === id);
    document.getElementById('certificateArea').innerHTML = `
        <div class="certificate" id="printLC">
            <div class="dise-code">
                <b>School</b><br>
                ${lc.dise_code}<br>
                <b>Dise Code</b>
            </div>
            <div class="cert-header">
                <h1>RAINBOW PUBLIC SCHOOL</h1>
                <p>(State Govt. Recognised English Medium School)</p>
                <p><b>Registered under Shubhi Education Foundation, DAHOD</b></p>
                <p>(Prescribed by Rule 12-1 Chapter IV of the Grant-in-Aid Code)</p>
            </div>
            <div class="cert-title">School Leaving Certificate</div>
            <div style="display: flex; justify-content: space-between; margin: 10px 0;">
                <div><b>Sr. No. ${lc.sr_no || ''}</b></div>
                <div><b>General Register No of the pupil ${lc.gr_no}</b></div>
            </div>
            <div class="cert-body">
                ${createRow('1. Name of pupil in full', lc.student_name)}
                ${createRow('2. Mother\'s Name', lc.mother_name)}
                ${createRow('3. Race and Caste (with subcaste)', lc.caste)}
                ${createRow('4. Place of Birth', lc.birth_place)}
                ${createRow('5. Date of Birth month and year<br>according to Christian era', lc.dob)}
                ${createRow('6. Aadhar Card No.', lc.aadhar)}
                ${createRow('7. UID Number', lc.uid)}
                ${createRow('8. Last School attended', lc.last_school)}
                ${createRow('9. Date of admission', lc.doa)}
                ${createRow('10. Progress', lc.progress)}
                ${createRow('11. Conduct', lc.conduct)}
                ${createRow('12. Date of leaving School', lc.dol)}
                ${createRow('13. Standard in which studying<br>and since when', lc.standard)}
                ${createRow('14. Reason of leaving School', lc.reason)}
                ${createRow('15. Remarks', lc.remarks)}
                ${createRow('16. Total No. of days present.......... out of Total working days..........', '')}
            </div>
            <div style="margin-top: 15px; font-size: 14px;">
                Certified that the above information is in accordance with the School Register.<br>
                <b>Dated ${lc.issue_date || ''}</b>
            </div>
            <div class="cert-footer">
                <div class="sign-box">
                    <div class="sign-line"></div>
                    Checked By
                </div>
                <div class="sign-box">
                    <div style="border: 2px solid #000; border-radius: 50%; width: 80px; height: 80px; margin: 0 auto; line-height: 75px; font-size: 10px;">SEAL</div>
                </div>
                <div class="sign-box">
                    <div class="sign-line"></div>
                    <b>Principal</b><br>
                    Rainbow Public School,<br>
                    Dahod
                </div>
            </div>
        </div>
    `;
    document.getElementById('printBtn').style.display = 'inline-block';
    window.scrollTo(0, 0);
}

function createRow(label, value) {
    return `<div class="cert-row">
        <div class="label">${label}</div>
        <div class="value">${value || ''}</div>
    </div>`;
}

async function deleteLC(id) {
    if(!confirm('Are you sure you want to delete this LC? This cannot be undone.')) return;

    showLoader(true);
    const { error } = await supabaseClient
  .from('leaving_certificates')
  .delete()
  .eq('id', id);

    if (error) {
        showAlert('Error deleting: ' + error.message, 'error');
        console.error(error);
    } else {
        showAlert('LC Deleted Successfully!');
        await loadLCData();
        document.getElementById('certificateArea').innerHTML = '';
        document.getElementById('printBtn').style.display = 'none';
    }
    showLoader(false);
}

function printCurrentLC() {
    window.print();
}

function searchLC() {
    let search = document.getElementById('searchBox').value.toLowerCase();
    let tbody = document.getElementById('lcTableBody');
    tbody.innerHTML = '';

    let filtered = lcData.filter(lc =>
        lc.gr_no.toLowerCase().includes(search) ||
        lc.student_name.toLowerCase().includes(search)
    );

    if(filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No records found</td></tr>';
        return;
    }

    filtered.forEach(lc => {
        tbody.innerHTML += `
            <tr>
                <td>${lc.sr_no || '-'}</td>
                <td>${lc.gr_no}</td>
                <td>${lc.student_name}</td>
                <td>${lc.standard || '-'}</td>
                <td>${lc.dol || '-'}</td>
                <td>
                    <button class="btn btn-primary" onclick="viewLC(${lc.id})">View</button>
                    <button class="btn btn-warning" onclick="showForm(${lc.id})">Edit</button>
                    <button class="btn btn-danger" onclick="deleteLC(${lc.id})">Delete</button>
                </td>
            </tr>
        `;
    });
}
</script>
</body>
</html>
