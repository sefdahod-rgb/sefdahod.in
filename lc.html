let allLC = [];

function formatDate(date){

if(!date) return "-";

const d = new Date(date);

return String(d.getDate()).padStart(2,'0') + "." +
String(d.getMonth()+1).padStart(2,'0') + "." +
d.getFullYear();

}

async function loadLC(){

const { data,error } =
await client
.from("leaving_certificates")
.select("*")
.order("id",{ascending:false});

if(error){

alert(error.message);

return;

}

allLC = data || [];

render();

}

function render(){

const table =
document.getElementById("table");

if(!table) return;

table.innerHTML = `
<tr>
<th>Sr No</th>
<th>GR No</th>
<th>Student Name</th>
<th>Standard</th>
<th>Actions</th>
</tr>
`;

if(allLC.length===0){

table.innerHTML += `
<tr>
<td colspan="5">
No Data Found
</td>
</tr>
`;

return;

}

allLC.forEach(a=>{

table.innerHTML += `
<tr>

<td>${a.sr_no || "-"}</td>

<td>${a.gr_no || "-"}</td>

<td>${a.student_name || "-"}</td>

<td>${a.standard || "-"}</td>

document.getElementById("leaving_date").value,

document.getElementById("standard").value,

reason:
document.getElementById("reason").value,

remarks:
document.getElementById("remarks").value

};

const { error } =
await client
.from("leaving_certificates")
.insert([data]);

if(error){

alert(error.message);

return;

}

alert("LC Created Successfully");

loadLC();

}

async function deleteLC(id){

if(!confirm("Delete LC?")) return;

await client
.from("leaving_certificates")
.delete()
.eq("id",id);

loadLC();

}
