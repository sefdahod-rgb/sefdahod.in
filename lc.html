<script>

);

let allLC = [];

function formatDate(date){

if(!date) return "-";

const d = new Date(date);

return String(d.getDate()).padStart(2,'0') + "." +
String(d.getMonth()+1).padStart(2,'0') + "." +
d.getFullYear();

}

/* LOAD DATA */

async function loadLC(){

const { data, error } =
await client
.from("leaving_certificates")
.select("*")
.order("id",{ascending:false});

if(error){

console.log(error);

alert(error.message);

return;

}

allLC = data || [];

render();

}

/* RENDER TABLE */

function render(){

const table =
document.getElementById("table");

table.innerHTML = `
<tr>
<th>Sr No</th>
<th>GR No</th>
<th>Student Name</th>
<th>Standard</th>
<th>Actions</th>
</tr>
`;

if(allLC.length===0){

table.innerHTML += `
<tr>
<td colspan="5">
No Data Found
</td>
</tr>
`;

return;

}

allLC.forEach(a=>{

table.innerHTML += `
<tr>

<td>${a.id}</td>

<td>${a.gr_no || "-"}</td>

<td>${a.student_name || "-"}</td>

<td>${a.standard || "-"}</td>

<td>

<button onclick="printLC(${a.id})">
Print
</button>

<button onclick="deleteLC(${a.id})">
Delete
</button>

</td>

</tr>
`;

});

}

/* ADD LC */

async function addLC(){

const data = {

gr_no:
document.getElementById("gr_no").value,

student_name:
document.getElementById("student_name").value,

mother_name:
document.getElementById("mother_name").value,

caste:
document.getElementById("caste").value,

birth_place:
document.getElementById("birth_place").value,

dob:
document.getElementById("dob").value,

aadhaar:
document.getElementById("aadhaar").value,

uid:
document.getElementById("uid").value,

last_school:
document.getElementById("last_school").value,

admission_date:
document.getElementById("admission_date").value,

progress:
document.getElementById("progress").value,

conduct:
document.getElementById("conduct").value,

leaving_date:
document.getElementById("leaving_date").value,

standard:
document.getElementById("standard").value,

reason:
document.getElementById("reason").value,

remarks:
document.getElementById("remarks").value

};

const { error } =
await client
.from("leaving_certificates")
.insert([data]);

if(error){

console.log(error);

alert(error.message);

return;

}

alert("LC Created Successfully");

loadLC();

}

/* DELETE */

async function deleteLC(id){

if(!confirm("Delete LC?")) return;

await client
.from("leaving_certificates")
.delete()
.eq("id",id);

loadLC();

}
