<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LC Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
padding:20px;
background:#fef3c7;
font-family:"Times New Roman",serif;
}

.box{
max-width:1200px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
text-align:center;
color:#991b1b;
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
padding:10px 20px;
background:#16a34a;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
margin:5px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th,
table td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#991b1b;
color:white;
}

.back{
background:#991b1b;
}

</style>

</head>

<body>

<div class="box">

<h1>School Leaving Certificate Management</h1>

<a href="admin.html">
<button class="back">
← Back to Admin
</button>
</a>

<input type="text" id="gr_no" placeholder="General Register Number">

<input type="text" id="student_name" placeholder="Student Name">

<input type="text" id="mother_name" placeholder="Mother Name">

<input type="text" id="caste" placeholder="Race & Caste">

<input type="text" id="birth_place" placeholder="Birth Place">

<input type="date" id="dob">

<input type="text" id="aadhaar" placeholder="Aadhaar Number">

<input type="text" id="uid" placeholder="UID Number">

<input type="text" id="last_school" placeholder="Last School Attended">

<input type="date" id="admission_date">

<input type="text" id="progress" placeholder="Progress">

<input type="text" id="conduct" placeholder="Conduct">

<input type="date" id="leaving_date">

<input type="text" id="standard" placeholder="Standard">

<input type="text" id="reason" placeholder="Reason of Leaving">

<textarea id="remarks" placeholder="Remarks"></textarea>

<button onclick="addLC()">
Create LC
</button>

<table id="table">

<tr>
<th>Sr No</th>
<th>GR No</th>
<th>Student Name</th>
<th>Standard</th>
<th>Action</th>
</tr>

</table>

</div>

<script>

const client = supabase.createClient(
"https://kqahcvaoxnmxfcgyyync.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYWhjdmFveG5teGZjZ3l5eW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODQ3NTksImV4cCI6MjA5MDQ2MDc1OX0.H_aABgpGglAMnVaDkBZU7xihvhHW8XT3U9PoR2VsFWg"
);

let allLC = [];

function formatDate(date){

if(!date) return "-";

const d = new Date(date);

return String(d.getDate()).padStart(2,'0') + "." +
String(d.getMonth()+1).padStart(2,'0') + "." +
d.getFullYear();

}

async function loadLC(){

const { data, error } = await client
.from("leaving_certificates")
.select("*")
.order("id",{ascending:false});

if(error){

console.log(error);
return;

}

allLC = data || [];

renderTable();

}

function renderTable(){

const table = document.getElementById("table");

table.innerHTML = `
<tr>
<th>Sr No</th>
<th>GR No</th>
<th>Student Name</th>
<th>Standard</th>
<th>Action</th>
</tr>
`;

if(allLC.length === 0){

table.innerHTML += `
<tr>
<td colspan="5">No Data Found</td>
</tr>
`;

return;

}

allLC.forEach((a,index)=>{

table.innerHTML += `
<tr>

<td>${index + 1}</td>

<td>${a.gr_no || "-"}</td>

<td>${a.student_name || "-"}</td>

<td>${a.standard || "-"}</td>

<td>

<button onclick="printLC(${a.id})">
Print
</button>

<button onclick="deleteLC(${a.id})">
Delete
</button>

</td>

</tr>
`;

});

}

async function addLC(){

const data = {

sr_no: allLC.length + 1,

gr_no: document.getElementById("gr_no").value,

student_name: document.getElementById("student_name").value,

mother_name: document.getElementById("mother_name").value,

caste: document.getElementById("caste").value,

birth_place: document.getElementById("birth_place").value,

dob: document.getElementById("dob").value,

aadhaar: document.getElementById("aadhaar").value,

uid: document.getElementById("uid").value,

last_school: document.getElementById("last_school").value,

admission_date: document.getElementById("admission_date").value,

progress: document.getElementById("progress").value,

conduct: document.getElementById("conduct").value,

leaving_date: document.getElementById("leaving_date").value,

standard: document.getElementById("standard").value,

reason: document.getElementById("reason").value,

remarks: document.getElementById("remarks").value

};

const { error } = await client
.from("leaving_certificates")
.insert([data]);

if(error){

alert(error.message);
return;

}

alert("LC Created Successfully");

loadLC();

}

async function deleteLC(id){

if(!confirm("Delete LC ?")) return;

await client
.from("leaving_certificates")
.delete()
.eq("id",id);

loadLC();

}

function printLC(id){

const a = allLC.find(x => x.id === id);

if(!a) return;

const w = window.open("","_blank");

w.document.write(`

<body>

<td>${a.birth_place}</td>
</tr>

<td>${formatDate(a.dob)}</td>
</tr>

<tr>
<td class="label">6. Aadhaar Card No.</td>
<td>${a.aadhaar}</td>
</tr>

<tr>
<td class="label">7. UID Number</td>
<td>${a.uid}</td>
</tr>

<tr>
<td class="label">8. Last School attended</td>
<td>${a.last_school}</td>
</tr>

<tr>
<td class="label">9. Date of admission</td>
<td>${formatDate(a.admission_date)}</td>
</tr>

<tr>
<td class="label">10. Progress</td>
<td>${a.progress}</td>
</tr>

<tr>
<td class="label">11. Conduct</td>
<td>${a.conduct}</td>
</tr>

<tr>
<td class="label">12. Date of leaving School</td>
<td>${formatDate(a.leaving_date)}</td>
</tr>

<tr>
<td class="label">13. Standard in which studying</td>
<td>${a.standard}</td>
</tr>

<tr>
<td class="label">14. Reason of leaving School</td>
<td>${a.reason}</td>
</tr>

<tr>
<td class="label">15. Remarks</td>
<td>${a.remarks}</td>
</tr>

</table>

<div class="footer">

<div>
Date : ${formatDate(new Date())}
</div>

<div>
Head Mistress
</div>

</div>

</div>

<script>
window.print();
<\/script>

</body>

</html>

`);

w.document.close();

}

loadLC();

</script>

</body>
</html>
