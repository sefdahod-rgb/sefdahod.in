<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Login - SEF Dahod</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,#003b73,#0f9d58)
}
.box{
  background:white;color:#172033;width:100%;max-width:390px;
  padding:28px;border-radius:16px;box-shadow:0 12px 35px #0003
}
.logo{width:75px;height:75px;object-fit:contain}
h2{margin:12px 0 5px}
.sub{color:#64748b;font-size:14px;margin-bottom:22px}
input{
  width:100%;padding:12px;margin:8px 0;border:1px solid #cbd5e1;
  border-radius:8px;font-size:16px
}
button{
  width:100%;padding:12px;border:0;border-radius:8px;
  background:#0f9d58;color:white;font-size:16px;font-weight:bold;
  cursor:pointer;margin-top:10px
}
button:disabled{opacity:.6;cursor:wait}
.link{
  display:block;text-align:center;margin-top:16px;color:#087443;
  cursor:pointer;background:none;border:0;font-size:14px
}
#msg{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box">
  <img src="logo.png" class="logo" alt="SEF Logo">
  <h2>School Login</h2>
  <div class="sub">Shubhi Education Foundation · Dahod</div>

  <form id="loginForm">
    <input id="email" type="email" placeholder="Email Address"
      autocomplete="username" required>
    <input id="password" type="password" placeholder="Password"
      autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Login</button>
  </form>

  <button class="link" id="forgotBtn" type="button">
    Forgot Password? ईमेल से Reset करें
  </button>
  <p id="msg" role="status"></p>
</div>

<script>
const SUPABASE_URL = "https://kqahcvaoxnmxfcgyyync.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYWhjdmFveG5teGZjZ3l5eW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODQ3NTksImV4cCI6MjA5MDQ2MDc1OX0.H_aABgpGglAMnVaDkBZU7xihvhHW8XT3U9PoR2VsFWg";

const client = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_ANON_KEY
);

const msg = document.getElementById("msg");
const loginBtn = document.getElementById("loginBtn");

function message(text, ok=false) {
  msg.textContent = text;
  msg.style.color = ok ? "#087443" : "#b91c1c";
}

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  loginBtn.disabled = true;
  message("Login जाँच रहे हैं...", true);

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const {data, error} = await client.auth.signInWithPassword({
      email, password
    });

    if (error) throw error;

    const {data: roleData, error: roleError} = await client
      .from("user_roles")
      .select("role")
      .eq("user_id", data.user.id)
      .maybeSingle();

    if (roleError || !roleData) {
      await client.auth.signOut();
      throw new Error("इस खाते का School Role नहीं मिला। Admin से संपर्क करें।");
    }

    if (roleData.role !== "owner") {
      // Other roles will be enabled after their permissions and dashboards
      // have been configured and tested.
      await client.auth.signOut();
      throw new Error("यह Login अभी केवल Owner खाते के लिए चालू है।");
    }

    // Temporary compatibility for existing pages.
    // Legacy pages must also be secured separately.
    localStorage.setItem("isAdmin", "yes");
    localStorage.setItem("schoolRole", "owner");

    const allowedPages = [
  "admin.html",
  "student-master.html",
  "fees-management.html",
  "attendance.html",
  "bonafide.html",
  "index.html",
  "user-management.html"
];

    let destination = localStorage.getItem("redirectAfterLogin") || "admin.html";
    localStorage.removeItem("redirectAfterLogin");

    if (!allowedPages.includes(destination)) destination = "admin.html";

    window.location.replace(destination);
  } catch (error) {
    message(error.message || "Login नहीं हो पाया।");
  } finally {
    loginBtn.disabled = false;
  }
});

document.getElementById("forgotBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    message("पहले ऊपर अपना Email Address लिखें।");
    document.getElementById("email").focus();
    return;
  }

  const btn = document.getElementById("forgotBtn");
  btn.disabled = true;
  message("Reset ईमेल भेजने की कोशिश हो रही है...", true);

  try {
    const {error} = await client.auth.resetPasswordForEmail(email, {
      redirectTo: "https://www.sefdahod.in/reset-password.html"
    });

    if (error) throw error;

    message(
      "यदि यह ईमेल पंजीकृत है, तो Password Reset लिंक भेज दिया गया है। Inbox और Spam जाँचें।",
      true
    );
  } catch (error) {
    message(error.message || "Reset ईमेल नहीं भेजा जा सका।");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
